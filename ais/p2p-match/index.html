"use strict";
// ACCT 2250 IL2: Procure-to-Pay and the Three-Way Match. Graded on the server by the lab-attempt edge function
// (fa-lab-platform, slug ais-p2p-match), which runs a copy of the code between the LAB markers below.
// Trailhead Outfitters Co. is fictional. The lab prints no business years: dates follow a fixed Jan-Feb calendar.
let YEAR = new Date().getFullYear();
/* ==== LAB BEGIN: copied verbatim into fa-lab-platform/supabase/functions/_shared/labs/ais-p2p-match.ts ==== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function parse(v) {

  if (s === "") return null;
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
const near = (a, b) => Math.abs(a - b) < 0.005;
const r2 = x => Math.round(x * 100) / 100;

// The five inventory vendors IL2 uses and their terms. (Trailhead's tent and tarp vendor is never used in this lab.)
const VENDORS = [["V-202", "Cascade Loft Textiles", "Net 30"], ["V-203", "Ironwood Pack Works", "Net 30"], ["V-204", "Tamarack Footwear Ltd.", "Net 60"],
  ["V-205", "Ember Camp Equipment", "Net 30"], ["V-206", "Brightline Gear", "Net 30"]];
// Their item records: SKU, description, vendor, standard cost. A PO's unit cost is the item's standard cost.
const ITEMS = [
  ["SLB-20", "Sleeping bag, 20°F", "V-202", 58], ["SLB-40", "Sleeping bag, 40°F", "V-202", 36], ["PAD-IN", "Insulated sleeping pad", "V-202", 31],
  ["PCK-65", "Backpack, 65 L", "V-203", 84], ["PCK-28", "Daypack, 28 L", "V-203", 33], ["DRY-20", "Dry sack, 20 L", "V-203", 7],
  ["BT-MID", "Mid hiking boot", "V-204", 62], ["BT-TRL", "Trail shoe", "V-204", 48], ["SCK-3P", "Merino socks, 3-pack", "V-204", 9],
  ["STV-1B", "Single-burner stove", "V-205", 24], ["CKS-2", "Two-person cook set", "V-205", 19], ["FLT-SQ", "Squeeze water filter", "V-205", 16],
  ["BTL-1L", "Insulated bottle, 1 L", "V-205", 8], ["JKT-RN", "Rain jacket", "V-206", 44], ["HDL-30", "Headlamp", "V-206", 11],
  ["PLE-TK", "Trekking poles, pair", "V-206", 27], ["FAK-1", "First-aid kit", "V-206", 9]];
// PO quantities step by 1 for items costing $60 or more, by 5 from $20 to $59, by 10 under $20.
const qstep = c => c >= 60 ? 1 : c >= 20 ? 5 : 10;
const MATCH = [["pay", "Approve as billed"], ["qty", "Hold: quantity"], ["price", "Hold: price"]];
const DEC = [["approve", "Approve"], ["escalate", "Escalate to Marcus"]];
const WHY = [["ok", "Meets the rule"], ["callback", "Bank details not confirmed through an independent number"], ["w9", "New vendor has no W-9 on file"],
  ["ceo", "New vendor has no CEO approval"], ["dup", "Looks like a duplicate of an existing vendor"]];
// Part 4's vendor master requests: practice scenarios, every one a pending request. `who` keeps a vendor from appearing twice.
const REQS = [
  { who: "V-204", dec: "escalate", why: "callback", text: "A caller says he's Tamarack Footwear's new controller and asks Aisha to change its remittance bank account. Her change request says she confirmed it by calling the number the caller left.",
    work: "A bank change must be confirmed at the number already in the vendor record, not one the requester supplies." },
  { who: "V-206", dec: "approve", why: "ok", text: "Brightline Gear mailed a letter with new bank details. Aisha's change request says she called Brightline's AP contact at the number already in the vendor record, who confirmed it; her call notes are attached.",
    work: "The change was confirmed through the number on file and documented." },
  { who: "Fernhill", dec: "escalate", why: "w9", text: "Aisha asks to set up Fernhill Lantern Co., a new headlamp supplier. Dana has approved it and the bank details were confirmed by calling the number on Fernhill's website, but the W-9 hasn't arrived.",
    work: "A new vendor needs a W-9 on file before it is set up." },
  { who: "Ashcroft", dec: "escalate", why: "ceo", text: "Aisha asks to set up Ashcroft Textile Mills, a new sleeping-bag liner supplier. The W-9 is on file and the bank details were confirmed by calling the number on its website. Dana is traveling and hasn't approved it.",
    work: "New vendors need the CEO's approval before they are set up." },
  { who: "Riverbend", dec: "approve", why: "ok", text: "Aisha asks to set up Riverbend Socks LLC. The request has a W-9, Dana's approval and bank details confirmed by calling the number on Riverbend's website.",
    work: "All three steps for a new vendor are done and documented." },
  { who: "V-202", dec: "escalate", why: "dup", text: "Aisha's request to set up “Cascade Loft Textile Inc.” shows the same address and tax ID as Cascade Loft Textiles (V-202).",
    work: "A second record for the same vendor makes duplicate or misdirected payments easier." },
  { who: "V-205", dec: "escalate", why: "callback", text: "A letter on Ember Camp Equipment letterhead asks Trailhead to send future payments to a new account. Aisha's change request says she called the phone number printed on the letter, and the person who answered confirmed.",
    work: "A number taken from the request itself proves nothing; call the number already on file." },
  { who: "V-203", dec: "approve", why: "ok", text: "Ironwood Pack Works updated its bank account in its vendor portal profile. Aisha's change request says she called Ironwood's AP manager at the number in the vendor record, who confirmed the change.",
    work: "The change was verified through the number on file." },
  { who: "V-207", dec: "escalate", why: "dup", text: "A request to set up “Nor'easter Freight” lists the same bank account and phone number as Nor'easter Freight Lines (V-207).",
    work: "It matches an existing vendor's bank account and phone, so it is likely a duplicate." },
  { who: "Quarry Hill", dec: "escalate", why: "w9", text: "Aisha asks to set up Quarry Hill Outfitting Supply for a rush order. Dana approved it and the bank details were confirmed by calling the number on its website; the vendor says the W-9 is “in the mail.”",
    work: "Without a W-9, Trailhead can't confirm the vendor's legal name and tax ID." },
  { who: "V-207", dec: "approve", why: "ok", text: "Nor'easter Freight Lines sent a new remit-to mailing address, with no bank change. Aisha's change request says she confirmed it with Nor'easter's billing contact at the number on file.",
    work: "A confirmed address change with no bank change meets the rule." }];
// Trailhead's story runs in January and February on a fixed calendar (Jan 1 is a Friday), never a clock or a year.
// Days are numbered from Jan 1 = 1, so Feb 3 = 34.
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const wdi = d => (5 + d - 1) % 7;
const day = d => WD[wdi(d)] + " " + (d > 31 ? "Feb " + (d - 31) : "Jan " + d);
const RECEIPT_DAYS = [19, 20, 21, 22, 25, 26, 27, 28, 29];

// ---------- Problem generator ----------
function gen(seed) {
  const r = mulberry32(seed);
  const R = (a, b, s) => { s = s || 1; return a + s * Math.floor(r() * (Math.floor((b - a) / s) + 1)); };
  const pick = xs => xs[Math.floor(r() * xs.length)];
  const HOLD = t => t === "qty" || t === "price";
  // The decisions, made once before any retry so their rates hold: the small set is a hold in half of all sets, and
  // 60% of those small holds fall over 2% but under $50 (the "whichever is less" trap). Exactly one bill is within.
  const smallHold = r() < 0.5, trap = smallHold && r() < 0.6;
  const types = [smallHold ? (r() < 0.5 ? "qty" : "price") : (r() < 0.4 ? "within" : "clean"), null, null, null];
  const wi = types[0] === "within" ? -1 : 1 + Math.floor(r() * 3);
  do { for (let i = 1; i < 4; i++) types[i] = i === wi ? "within" : pick(["clean", "qty", "price"]); } while (!types.some(HOLD));
  // Large sets: every quantity hold, and 35% of the others, have a short receipt. The small set is received in full.
  const partial = types.map((t, i) => i > 0 && (t === "qty" || r() < 0.35));
  // Part 4: three requests, at least one to approve and one to escalate, never the same vendor twice.
  let reqs;
  do { reqs = []; while (reqs.length < 3) { const k = Math.floor(r() * REQS.length); if (reqs.indexOf(k) < 0) reqs.push(k); } }
  while (!reqs.some(k => REQS[k].dec === "approve") || !reqs.some(k => REQS[k].dec === "escalate") || new Set(reqs.map(k => REQS[k].who)).size < 3);

  let tries = 0, vs = [];
  // One document set; only its vendor's SKUs, quantities, short receipt and bill difference are retried.
  function makeSet(i) {
    const small = i === 0, type = types[i], V = VENDORS[vs[i]], its = ITEMS.filter(x => x[2] === V[0]);
    for (let k = 0; k < 300; k++) {
      if (++tries > 50000) throw new Error("Could not generate a problem set");
      let lines;
      if (small) {
        const c = its.filter(x => !(trap && type === "qty") || x[3] <= 20); if (!c.length) return null;
        const it = pick(c), st = qstep(it[3]), lo = Math.ceil(1000 / (it[3] * st)), hi = Math.floor(2249 / (it[3] * st));
        if (hi < lo) continue;
        lines = [{ it, q: st * R(lo, hi) }];
      } else {
        const n = r() < 0.5 ? 1 : 2, a = pick(its); let b = a; while (n === 2 && b === a) b = pick(its);
        lines = (n === 1 ? [a] : [a, b]).map(it => { const st = qstep(it[3]), lo = n === 1 ? 3000 : 1500, hi = n === 1 ? 24000 : 12000;
          return { it, q: st * R(Math.ceil(lo / (it[3] * st)), Math.floor(hi / (it[3] * st))) }; });
      }
      const ord = lines.reduce((t, l) => t + l.q * l.it[3], 0); // PO total, whole dollars
      if (small ? ord < 1000 || ord > 2249 : ord < 3000 || ord > 24000) continue;
      // Never the primer's worked example (Ember's order of 120 stoves and 200 filters).
      if (lines.some(l => l.it[0] === "STV-1B" && l.q === 120 || l.it[0] === "FLT-SQ" && l.q === 200)) continue;
      const rec = lines.map(l => l.q);
      if (partial[i]) {
        const j = Math.floor(r() * lines.length), l = lines[j], st = qstep(l.it[3]), sh = Math.round(l.q * R(10, 40) / 100 / st) * st;
        if (sh < st || sh < 0.1 * l.q || sh > 0.4 * l.q) continue;
        rec[j] = l.q - sh;
      }
      // Amounts in cents from here. Supported = received × PO cost; tolerance = the smaller of 2% of it and $50.
      const S = lines.reduce((t, l, j) => t + rec[j] * l.it[3], 0) * 100;
      if (!small && S < 260000) continue; // a large set's 2% is always over $50
      const T = Math.min(S / 50, 5000), bq = rec.slice(), bc = lines.map(l => l.it[3] * 100), j = Math.floor(r() * lines.length);
      if (type === "within") { if (r() < 0.5) bc[j] += R(5, 40); else { if (lines[j].it[3] * 100 > T - 300) continue; bq[j] += 1; } }
      else if (type === "qty") { if (small) bq[0] += trap ? R(1, 3) : qstep(lines[0].it[3]) * R(1, 6); else lines.forEach((l, m) => { bq[m] = l.q; }); }
      else if (type === "price") bc[j] += small && trap ? R(25, 95, 5) : R(100, Math.min(400, Math.floor(lines[j].it[3] * 20)), 5); // at most 20% of cost
      const B = bq.reduce((t, x, m) => t + x * bc[m], 0), D = B - S;
      if (B < 100000) continue;
      if (type === "within" && (D < 300 || D > T - 300)) continue;
      if (HOLD(type) && (small && trap ? D < T + 300 || D > 4799 : D < T + 1000 || small && D < 5300)) continue;
      // No listed slip may equal the answer it is meant to catch.
      const Sord = ord * 100, Sbill = bq.reduce((t, x, m) => t + x * lines[m].it[3], 0) * 100, qd = bq.some((x, m) => x !== rec[m]);
      const clash = (a, xs) => xs.some(x => x != null && Math.abs(a - x) < 1);
      if (clash(S, [partial[i] ? Sord : null, qd ? Sbill : null, B !== S ? B : null])) continue;
      if (clash(T, [T === 5000 ? S / 50 : 5000, B !== S ? B / 50 : null, S / 5, S / 500])) continue;
      if (clash(D, [D !== 0 ? -D : null, partial[i] ? B - Sord : null])) continue;
      if (type === "within" && clash(S, [partial[i] ? Sord : null])) continue;
      return { V, type, small, trap: small && trap, partial: partial[i],
        lines: lines.map((l, m) => ({ sku: l.it[0], desc: l.it[1], cost: l.it[3], qty: l.q, rec: rec[m], bq: bq[m], bc: bc[m] / 100 })), total: B / 100 };
    }
    return null;
  }
  for (;;) {
    vs = []; while (vs.length < 4) { const k = Math.floor(r() * 5); if (vs.indexOf(k) < 0) vs.push(k); }
    const raw = [];
    for (let i = 0; i < 4; i++) { const s = makeSet(i); if (!s) break; raw.push(s); }
    if (raw.length < 4) continue;
    if (new Set(raw.map(s => Math.round(s.total * 100))).size < 4) { tries++; continue; } // four different bill totals
    // Shuffle the sets into Bill A-D, then date and number them: POs Jan 5-8, receipts Jan 19-29, bills 1-5 days later.
    const order = [];
    while (order.length < 4) { const k = Math.floor(r() * 4); if (order.indexOf(k) < 0) order.push(k); }
    const sets = order.map(k => raw[k]);
    const poD = sets.map(() => R(5, 8)), rcD = sets.map(() => pick(RECEIPT_DAYS));
    const blD = rcD.map(d => { for (;;) { const x = d + R(1, 5); if (wdi(x) !== 0 && wdi(x) !== 6) return x; } });
    const nums = (lo, hi, skip) => { const out = []; while (out.length < 4) { const x = R(lo, hi); if (out.indexOf(x) < 0 && skip.indexOf(x) < 0) out.push(x); } return out.sort((a, b) => a - b); };
    const rank = ds => { const out = []; sets.map((s, k) => k).sort((a, b) => ds[a] - ds[b] || a - b).forEach((k, m) => { out[k] = m; }); return out; };
    const poN = nums(59000, 59999, [59318]), irN = nums(59000, 59999, poN.concat([59318])), blN = nums(69000, 69999, [69318]);
    const poR = rank(poD), irR = rank(rcD), blR = rank(blD);
    const P = {
      sets: sets.map((s, k) => {
        let vno; do { vno = s.V[0].slice(2) + "-" + R(9999100, 9999999); } while (vno === "205-9999162");
        return { label: "ABCD"[k], vendor: { id: s.V[0], name: s.V[1], terms: s.V[2] },
          po: { no: "PO-" + poN[poR[k]], date: day(poD[k]), approvedBy: "Aisha Rahman", lines: s.lines.map(l => ({ sku: l.sku, desc: l.desc, qty: l.qty, cost: l.cost })) },
          receipt: { no: "IR-" + irN[irR[k]], date: day(rcD[k]), receivedBy: "Mei Tanaka", lines: s.lines.map(l => ({ sku: l.sku, qty: l.rec })) },
          bill: { no: "BL-" + blN[blR[k]], vendorNo: vno, date: day(blD[k]), lines: s.lines.map(l => ({ sku: l.sku, qty: l.bq, cost: l.bc })), total: s.total } };
      }),
      kinds: sets.map(s => ({ type: s.type, small: s.small, trap: s.trap, partial: s.partial })),
      reqs
    };
    var RESERVED = [String.fromCharCode(36, 49, 48, 50), String.fromCharCode(55, 55, 51, 49)];
    // Skip a few reserved values (kept in step with the server module).
    const text = JSON.stringify(buildParts(P)) + JSON.stringify(P);
    if (RESERVED.some(function (r) { return text.indexOf(r) >= 0; })) { tries++; continue; }
    return P;
  }
}
// Everything a set's answers and messages need, in dollars, from the documents alone.
function solve(P) {
  const c = x => Math.round(x * 100);
  return P.sets.map((s, i) => {
    const K = P.kinds[i], po = s.po.lines, rc = s.receipt.lines, bl = s.bill.lines;
    const Sc = po.reduce((t, l, m) => t + rc[m].qty * c(l.cost), 0), Bc = c(s.bill.total);
    const Tc = Math.min(Sc / 50, 5000), Dc = Bc - Sc;
    const ordC = po.reduce((t, l) => t + l.qty * c(l.cost), 0), billAtPo = po.reduce((t, l, m) => t + bl[m].qty * c(l.cost), 0);
    const qline = bl.findIndex((l, m) => l.qty !== rc[m].qty), pline = bl.findIndex((l, m) => c(l.cost) !== c(po[m].cost));
    return { S: Sc / 100, B: Bc / 100, T: Tc / 100, D: Dc / 100, x: Sc / 5000, ord: ordC / 100, billAtPo: billAtPo / 100,
      qd: qline >= 0, qline, pline, type: K.type, small: K.small, trap: K.trap, partial: K.partial,
      res: K.type === "within" || K.type === "clean" ? "pay" : K.type };
  });
}

// ---------- Parts ----------
const optLabel = (opts, v) => { const o = opts.find(x => x[0] === v); return o ? o[1] : String(v); };
function sel(id, label, opts, ans, reason, traps, work, extra) {
  return Object.assign({ id, label, kind: "sel", opts, ans, work,
    wrong: v => "Not “" + optLabel(opts, v) + ".” " + (traps && Object.prototype.hasOwnProperty.call(traps, v) ? traps[v] : reason) }, extra || {});
}
function amt(id, label, ans, wrong, work, extra) { return Object.assign({ id, label, kind: "$", ans, dec: 2, wrong, work }, extra || {}); }
function buildParts(P) {
  const X = solve(P), sets = P.sets, parts = [];
  const name = i => "Bill " + sets[i].label;
  const vname = i => sets[i].vendor.name;
  const names = xs => xs.length === 1 ? xs[0] : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
  const recTerms = i => sets[i].po.lines.map((l, m) => sets[i].receipt.lines[m].qty.toLocaleString("en-US") + " × " + cents(l.cost)).join(" + ");
  const sWork = i => recTerms(i) + " = " + cents(X[i].S);
  const dWork = i => cents(X[i].B) + " − " + cents(X[i].S) + " = " + cents(X[i].D);
  const tWork = i => "2% × " + cents(X[i].S) + " = " + cents(X[i].x) + "; the smaller of " + cents(X[i].x) + " and $50.00 is " + cents(X[i].T);

  // Part 1: the supported amount, difference and tolerance for each bill.
  parts.push({ id: "docs", phase: "match", tick: "1", title: "Read the documents", layout: "table",
    desc: "From Marcus Oyelaran, Controller: NetSuite has put four vendor bills in the review queue, each with its purchase order and item receipt. Check NetSuite's work against our rule, P7: a bill is paid only when it agrees with the PO and the receipt within 2% or $50, whichever is less. Decide which bills can be approved for payment, and post the one that passes with a small difference. Aisha Rahman, our purchasing manager, also sent three vendor master requests that need a decision. " +
      "Start with three amounts for each bill. The supported amount is each quantity received × its PO unit cost, added up. The difference is the bill total − the supported amount. The tolerance is the smaller of 2% of the supported amount and $50.00, to the cent.",
    itemLabel: "Bill", cols: [{ key: "s", label: "Supported amount" }, { key: "d", label: "Difference (bill − supported)" }, { key: "t", label: "Tolerance" }],
    items: sets.map((s, i) => ({ text: name(i) + " · " + vname(i) })),
    fields: sets.flatMap((s, i) => { const x = X[i]; return [
      amt("s" + i, name(i) + ": supported amount", x.S, v =>
        x.partial && near(v, x.ord) ? "Pay only for what arrived: use the receipt's quantity × the PO unit cost." :
        x.qd && near(v, x.billAtPo) ? "Use the receipt's quantity, not the bill's." :
        near(v, x.B) ? "That's the bill. The supported amount comes from the PO price and the receipt quantity." :
        "Supported amount = each quantity received × its PO unit cost, added up.", sWork(i), { row: i, col: "s" }),
      amt("d" + i, name(i) + ": difference", x.D, (v, n) =>
        x.D !== 0 && near(v, -x.D) ? "Difference = bill − supported amount." :
        x.partial && near(v, r2(x.B - x.ord)) ? "Compare with what was received, not what was ordered." :
        n["s" + i] != null && !near(n["s" + i], x.S) && near(v, r2(x.B - n["s" + i])) ? "Your subtraction is right, but your supported amount is not. Fix it first." :
        "Difference = the bill total, " + cents(x.B) + ", − the supported amount.", dWork(i), { row: i, col: "d" }),
      amt("t" + i, name(i) + ": tolerance", x.T, (v, n) =>
        x.T === 50 && near(v, x.x) ? "The tolerance is 2% or $50, whichever is less; here $50 is less." :
        x.T < 50 && near(v, 50) ? "2% of " + cents(x.S) + " is " + cents(x.x) + ", which is less than $50, so the tolerance is " + cents(x.x) + "." :
        x.B !== x.S && near(v, 0.02 * x.B) ? "Take 2% of the supported amount, not of the bill." :
        near(v, 0.2 * x.S) || near(v, 0.002 * x.S) ? "2% is 0.02." :
        n["s" + i] != null && !near(n["s" + i], x.S) && near(v, r2(Math.min(0.02 * n["s" + i], 50))) ? "Your tolerance rule is right, but your supported amount is not. Fix it first." :
        "Tolerance = the smaller of 2% × the supported amount and $50.00.", tWork(i), { row: i, col: "t" })]; }),
    hint: "Supported = received quantity × PO cost. Difference = bill − supported. Tolerance = min(2% of supported, $50).",
    why: "The match pays only for goods that were ordered at the agreed price and actually received.",
    walk: sets.map((s, i) => ({ keys: ["s" + i, "d" + i, "t" + i],
      text: name(i) + ": multiply each received quantity by its PO unit cost, subtract that from the bill, then take the smaller of 2% and $50.",
      formula: sWork(i) + " · " + dWork(i) + " · " + tWork(i) })) });

  // Part 2: the match result (given forward: each row states Part 1's figures).
  const why2 = i => { const x = X[i], s = sets[i];
    if (x.type === "within") return cents(x.D) + " is within the " + cents(x.T) + " tolerance, so the bill is approved as billed. The small difference goes to 5200.";
    if (x.type === "clean") return x.partial ? "The bill agrees with what was received. A partial delivery isn't an exception if the bill is for the received quantity." : "The bill agrees with the PO and the receipt, so it is approved as billed.";
    if (x.type === "qty") return "The prices agree. The bill charges for " + s.bill.lines[x.qline].qty.toLocaleString("en-US") + " " + s.bill.lines[x.qline].sku + " but only " + s.receipt.lines[x.qline].qty.toLocaleString("en-US") + " arrived: a quantity exception.";
    return "Every billed quantity equals the quantity received. The bill's unit cost for " + s.bill.lines[x.pline].sku + " is " + cents(s.bill.lines[x.pline].cost) + " vs. " + cents(s.po.lines[x.pline].cost) + " on the PO: a price exception."; };
  const over = i => { const x = X[i];
    return x.small && x.D < 50 ? "It's under $50, but the tolerance is the smaller of 2% and $50: " + cents(x.T) + ". " + cents(x.D) + " is over it, so hold the bill." :
      "The difference of " + cents(x.D) + " is more than the " + cents(x.T) + " tolerance, so the bill is held."; };
  const traps2 = i => { const x = X[i];
    if (x.res === "pay") return { qty: why2(i), price: why2(i) };
    return x.res === "qty" ? { pay: over(i), price: why2(i) } : { pay: over(i), qty: why2(i) }; };
  parts.push({ id: "match", phase: "match", tick: "2", title: "Match result for each bill", layout: "table",
    desc: "Each row gives that bill's supported amount, difference and tolerance from Part 1. Choose the result: approve the bill as billed, or hold it and name the document that disagrees with the bill.",
    itemLabel: "Bill", cols: [{ key: "r", label: "Match result" }],
    items: sets.map((s, i) => ({ text: name(i) + " · " + vname(i) + ": supported " + cents(X[i].S) + ", difference " + cents(X[i].D) + ", tolerance " + cents(X[i].T) })),
    fields: sets.map((s, i) => sel("r" + i, name(i) + ": match result", MATCH, X[i].res, why2(i), traps2(i), X[i].res === "pay" ? why2(i) : over(i).replace(/^It's under \$50, but the/, "The") + " " + why2(i), { row: i, col: "r" })),
    hint: "Compare the difference with the tolerance. If it's over, look for which document disagrees: quantity or price.",
    why: "Holding a bill until the vendor corrects it is cheaper than chasing a refund.",
    walk: sets.map((s, i) => ({ keys: ["r" + i], text: name(i) + ": " + (X[i].res === "pay" ? why2(i) : over(i) + " " + why2(i)),
      formula: cents(X[i].D) + (X[i].D > X[i].T ? " > " : " ≤ ") + cents(X[i].T) + " → " + optLabel(MATCH, X[i].res) })) });

  // Part 3: approve and post (given forward: the results and the within bill's figures).
  const w = X.findIndex(x => x.type === "within"), held = sets.map((s, i) => i).filter(i => X[i].res !== "pay");
  const clean = sets.map((s, i) => i).filter(i => X[i].type === "clean"), xw = X[w];
  const payWork = i => X[i].res === "pay" ? "Approved as billed: " + cents(X[i].B) + "." : "On hold: $0.00 approved.";
  parts.push({ id: "pay", phase: "match", tick: "3", title: "Approve and post", layout: "table",
    desc: name(w) + " (" + vname(w) + ") passed within tolerance: supported " + cents(xw.S) + ", difference " + cents(xw.D) + ". " +
      (held.length === 1 ? name(held[0]) + " is" : names(held.map(name)) + " are") + " on hold." +
      (clean.length ? " " + names(clean.map(name)) + (clean.length === 1 ? " matches" : " match") + " exactly." : "") +
      " For each bill, enter the amount approved for payment. Enter 0 for a bill on hold. Then post " + name(w) + "'s vendor bill in NetSuite: its item receipt already credited 2050 at PO cost.",
    itemLabel: "Bill", cols: [{ key: "pay", label: "Amount approved for payment" }],
    items: sets.map((s, i) => ({ text: name(i) + " · " + vname(i) + ": " + optLabel(MATCH, X[i].res) })),
    fields: sets.map((s, i) => { const x = X[i]; return amt("pay" + i, name(i) + ": amount approved for payment", x.res === "pay" ? x.B : 0, v =>
      x.res !== "pay" ? "This bill is on hold, so nothing is approved for payment yet." :
      near(v, 0) ? "This bill passed the match, so it is approved for payment as billed." :
      x.type === "within" && near(v, x.S) ? "A bill within tolerance is paid as billed: " + cents(x.B) + "." :
      x.partial && near(v, x.ord) ? "The bill is for the goods received. Approve it as billed: " + cents(x.B) + "." :
      "An approved bill is paid as billed, at its bill total.", payWork(i), { row: i, col: "pay" }); }).concat([
      amt("dr2050", "Debit to 2050 Inventory Received Not Billed", xw.S, v =>
        near(v, xw.B) ? "2050 is cleared at the value received, PO cost × quantity received: " + cents(xw.S) + ". The extra goes to 5200." :
        xw.partial && near(v, xw.ord) ? "2050 holds only what was received. Clear it at PO cost × quantity received, not the PO total." :
        "Debit 2050 for the value received: PO cost × quantity received.", "The value received: " + sWork(w), { sub: name(w) }),
      amt("v5200", "Debit to 5200 Inventory Adjustments", xw.D, v =>
        near(v, xw.T) ? "Post the actual difference, not the tolerance." :
        near(v, 0) ? "The accepted difference still has to be posted. Debit 5200 for bill − supported amount." :
        near(v, -xw.D) ? "The bill is above the value received, so 5200 takes a debit for the positive difference." :
        "Debit 5200 for the accepted difference: bill total − supported amount.", "The accepted difference: " + dWork(w), { sub: name(w) }),
      amt("cr2000", "Credit to 2000 Accounts Payable", xw.B, (v, n) =>
        near(v, xw.S) ? "Accounts payable is what Trailhead owes the vendor: the bill total." :
        n.dr2050 != null && n.v5200 != null && near(v, r2(n.dr2050 + n.v5200)) ? "Your addition is right, but your debits are not. Fix them first." :
        "Credit 2000 Accounts Payable for what Trailhead owes the vendor: the bill total.", "What Trailhead owes " + vname(w) + ": the bill total, " + cents(xw.B) + ".", { sub: name(w) })]),
    hint: "The receipt credited 2050 at PO cost; the bill clears 2050 at that same amount and records what Trailhead owes in 2000. Any accepted amount billed above the value received goes to 5200.",
    why: "2050 holds goods received but not yet billed. Matching clears it to zero, so a balance left in 2050 points to a missing or held bill.",
    walk: [{ keys: sets.map((s, i) => "pay" + i), text: "A held bill gets nothing until the vendor corrects it. A bill that passes is paid as billed.", formula: sets.map((s, i) => name(i) + ": " + (X[i].res === "pay" ? cents(X[i].B) : "$0.00")).join(" · ") },
      { keys: ["dr2050", "v5200", "cr2000"], text: name(w) + " clears 2050 at the value received, puts the accepted difference in 5200 and owes the vendor the bill total.",
        formula: "Dr 2050 " + cents(xw.S) + " + Dr 5200 " + cents(xw.D) + " = Cr 2000 " + cents(xw.B) }] });

  // Part 4: vendor master requests (practice scenarios).
  const rq = P.reqs.map(k => REQS[k]);
  parts.push({ id: "vendor", phase: "vendor", tick: "4", title: "Vendor master requests", layout: "table", numbered: true,
    desc: "The vendor master is the set of vendor records that orders, bills and payments draw on. Decide each pending request: approve it, or escalate it to Marcus, and give the reason. " +
      "The rule for a new vendor: a W-9 on file, approval from Dana Whitfield, the CEO, and bank details confirmed by calling a number found independently (the vendor's website or a known contact). " +
      "For an existing vendor: any bank change confirmed by calling the number already in the vendor record. Aisha Rahman in purchasing submits every request. " +
      "These are practice scenarios written for this lab. They are not part of Trailhead's 2026 records or the evidence for Labs C1 and C2 or Project M3, and they don't describe how Trailhead's NetSuite account or company is actually set up.",
    itemLabel: "Request", cols: [{ key: "dec", label: "Decision" }, { key: "why", label: "Reason" }],
    items: rq.map(q => ({ text: q.text })),
    fields: rq.flatMap((q, i) => [
      sel("dec" + i, "Request " + (i + 1) + ": decision", DEC, q.dec, q.dec === "approve" ? "Every step in the rule is done, so this one can be approved." : q.work,
        q.dec === "approve" ? null : q.why === "callback" ? { approve: q.work + " Escalate it before the bank details change." } : null,
        q.dec === "approve" ? "Every step in the rule is done, so approve it." : "A step in the rule is missing, so escalate it to Marcus.", { row: i, col: "dec" }),
      sel("why" + i, "Request " + (i + 1) + ": reason", WHY, q.why, q.work, null, q.work, { row: i, col: "why" })]),
    hint: "New vendor: W-9, CEO approval and an independent call. Existing vendor: a call to the number on file. Ask which step is missing.",
    why: "Changing a vendor's bank account is the easiest way to redirect a real payment, so the vendor master needs its own controls.",
    walk: rq.map((q, i) => ({ keys: ["dec" + i, "why" + i], text: "Request " + (i + 1) + ": " + q.work, formula: optLabel(DEC, q.dec) + " · " + optLabel(WHY, q.why) })) });
  return parts;
}

// ---------- Grading ----------
// Every amount matches to the cent. A choice gets "Not “label.”" and the reason.
function grade(p, vals) {
  const nums = {}; p.fields.forEach(f => { if (f.kind !== "sel") { const v = parse(vals[f.id]); nums[f.id] = v === null || isNaN(v) ? null : v; } });
  const res = {}; let all = true;
  p.fields.forEach(f => {
    const raw = vals[f.id];
    if (f.kind === "sel") {
      const v = typeof raw === "string" ? raw : "";
      if (!v || !f.opts.some(o => o[0] === v)) res[f.id] = { ok: false, msg: "Choose an answer." };
      else res[f.id] = v === f.ans ? { ok: true, msg: "Correct." } : { ok: false, msg: f.wrong(v) };
    } else {
      const v = parse(raw);
      if (v === null) res[f.id] = { ok: false, msg: "Enter an amount." };
      else if (isNaN(v)) res[f.id] = { ok: false, msg: "Enter a number only, like 2400 or 12.50." };
      else res[f.id] = near(v, f.ans) ? { ok: true, msg: "Correct." } : { ok: false, msg: f.wrong(v, nums) };
    }
    if (!res[f.id].ok) all = false;
  });
  return { res, all };
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function bizHTML() { return "<b>Trailhead Outfitters Co.</b> buys camping and hiking gear from its vendors and sells it to outdoor shops and web shoppers, all in NetSuite. You are a staff accountant reporting to Marcus Oyelaran, the controller."; }
// The data panel reads only the public problem facts (the server's publicInfo key `sets`), so it is the same in both modes.
// One table per bill, its columns grouped by document: the PO, the item receipt and the vendor bill.
function billTable(s) {
  const n = x => Number(x).toLocaleString("en-US");
  const rows = s.po.lines.map((l, m) => '<tr><td class="item">' + esc(l.sku) + '<small>' + esc(l.desc) + '</small></td><td class="r">' + n(l.qty) + '</td><td class="r">' + cents(l.cost) +
    '</td><td class="r">' + n(s.receipt.lines[m].qty) + '</td><td class="r">' + n(s.bill.lines[m].qty) + '</td><td class="r">' + cents(s.bill.lines[m].cost) + '</td></tr>').join("");
  return '<h3 class="billh">Bill ' + esc(s.label) + ' · ' + esc(s.vendor.id) + ' ' + esc(s.vendor.name) + ' · ' + esc(s.vendor.terms) + '</h3>' +
    '<div class="scroll" style="margin-top:6px"><table class="dtab mtab"><caption style="text-align:left">' +
    '<span class="cap-date">Purchase order ' + esc(s.po.no) + ', ' + esc(s.po.date) + ', approved by ' + esc(s.po.approvedBy) + '</span>' +
    '<span class="cap-date">Item receipt ' + esc(s.receipt.no) + ', ' + esc(s.receipt.date) + ', received by ' + esc(s.receipt.receivedBy) + '</span>' +
    '<span class="cap-date">Vendor bill ' + esc(s.bill.no) + ', ' + esc(s.bill.date) + ' (vendor invoice ' + esc(s.bill.vendorNo) + ')</span></caption>' +
    '<thead><tr class="docs"><th scope="col" class="blank"><span class="sr-only">Item</span></th><th scope="colgroup" colspan="2">Purchase order</th><th scope="colgroup" colspan="1">Item receipt</th><th scope="colgroup" colspan="2">Vendor bill</th></tr>' +
    '<tr><th scope="col">Item</th><th scope="col" class="r">Quantity ordered</th><th scope="col" class="r">Unit cost</th><th scope="col" class="r">Quantity received</th><th scope="col" class="r">Quantity billed</th><th scope="col" class="r">Unit cost billed</th></tr></thead>' +
    '<tbody>' + rows + '</tbody><tfoot><tr><td colspan="5">Bill total</td><td class="r">' + cents(s.bill.total) + '</td></tr></tfoot></table></div>';
}
const P7 = '<div class="rule"><b>P7 · Three-way match.</b> A vendor bill is paid only when it agrees with the purchase order and the item receipt within 2% or $50, whichever is less.</div>';
function vendorRule() {
  return '<div class="rule"><b>New vendor.</b> A W-9 on file, approval from Dana Whitfield (CEO), and bank details confirmed by calling a number found independently: the vendor\'s website or a known contact.</div>' +
    '<div class="rule"><b>Existing vendor.</b> Any bank change confirmed by calling the number already in the vendor record.</div>' +
    '<div class="rule"><b>Who submits.</b> Aisha Rahman in purchasing submits every request. Escalated requests go to Marcus Oyelaran.</div>' +
    '<p class="note">These requests are practice scenarios written for this lab, not Trailhead\'s records.</p>';
}
function dataHTML(c) {
  const P = c.P || {}, id = c.part ? c.part.id : "";
  if (id === "vendor") return { title: "Vendor master rule", sub: "For each pending request", html: vendorRule() };
  return { sub: "PO, item receipt and vendor bill for each", html: (P.sets || []).map(billTable).join("") + P7 };
}
