let YEAR = new Date().getFullYear();
/* ==== LAB BEGIN: copied verbatim into fa-lab-platform/supabase/functions/_shared/labs/ais-itgc-cyber.ts ==== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SCENARIO = "These are practice scenarios written for this lab. They are not part of Trailhead's 2026 records or the evidence for Labs C1 and C2 or Project M3, and they don't describe how Trailhead's NetSuite account or company is actually set up.";

// ---------- Part 1: IT general control areas ----------
const AREAOPT = [["access", "Access to programs and data"], ["change", "Program change management"], ["ops", "Computer operations"]];
const AREAWHY = {
  "access-change": "Access controls decide who can use the system; change controls govern how the system itself is changed.",
  "change-ops": "Change management is about altering the system; operations is about running it day to day.",
  "access-ops": "Access controls decide who can use the system; operations controls keep it running day to day." };
const AREAS = [

  { ans: "change", text: "Scripts that change NetSuite data can be deployed only from the sandbox through a change ticket.", work: "Routing every script through a controlled path is change management." },
  { ans: "change", text: "The web store host changes Trailhead's checkout pages only after a ticket approved by Sam and Marcus.", work: "Approved tickets for changes to a system Trailhead relies on are change management." },

// ---------- Part 2: deficiency or not ----------
const DEFOPT = [["yes", "Deficiency"], ["no", "No deficiency"]];
const WHYOPT = [["ok", "Works as designed: no deficiency"], ["noapproval", "Change went live without approval"],
  ["notest", "Change went live without testing"], ["selftest", "Change tested only by the person who built it"],
  ["nofollow", "Failure not detected or followed up promptly"], ["norestore", "Backups never tested by a restore"],
  ["excess", "Access granted beyond what was approved"], ["noverify", "Identity not verified before a password reset"]];
const WORKING = "That's the control working, not a deficiency.";
const DEFS = [
  { def: "yes", why: "noapproval", text: "Sam fixed a routing error in the live vendor-bill approval workflow. He tested the fix in the sandbox, but no one approved the change before it went live.", work: "Even a tested fix to a live control needs approval before it goes in." },

// ---------- Part 3: the service provider's control or Trailhead's ----------
const WHOOPT = [["svc", "Oracle NetSuite (its SOC reports cover it)"], ["own", "Trailhead must run it"]];
const SOCS = [
  { ans: "svc", text: "Physical security and power at the data centers that run NetSuite.", work: "Oracle runs the data centers; its SOC reports cover them." },

  { ans: "own", text: "Testing Trailhead's own scripts, saved searches and forms in each release preview.", work: "Oracle tests its software; testing Trailhead's customizations is a complementary user entity control.",

  { ans: "own", text: "Securing the laptops staff use to sign in to NetSuite.", work: "Devices outside Oracle's service are Trailhead's to protect." },
  { ans: "own", text: "Approving changes to Trailhead's NetSuite workflows before they go live.", work: "Changes Trailhead makes to its own setup are Trailhead's to control, a complementary user entity control." }];
const RELIES = "Trailhead relies on Oracle's SOC reports for it.";

// ---------- Part 4: cyber threats and the controls that answer them ----------
const THREATOPT = [["phish", "Phishing"], ["ransom", "Ransomware"], ["imperson", "Impersonation (business email compromise or deepfake)"],
  ["stuff", "Credential stuffing"], ["dos", "Denial of service"], ["insider", "Insider data theft"], ["device", "Lost or stolen device"], ["sqli", "SQL injection"]];
const THREATWHY = {
  phish: "Phishing tricks someone into giving up a password or clicking a harmful link.",
  ransom: "Ransomware encrypts files and demands payment to unlock them.",
  imperson: "Impersonation pretends to be a trusted person to get money or data.",
  stuff: "Credential stuffing tries passwords leaked from other sites against a login, by machine and at scale.",
  dos: "Denial of service floods a system with traffic so real users can't reach it.",
  insider: "Insider data theft is someone with legitimate access taking data out.",
  device: "A lost or stolen device puts the data saved on it at risk.",
  sqli: "SQL injection slips database commands into an input field." };
const PHISHVSIMP = "Phishing tricks someone into giving up a password or clicking; impersonation pretends to be a person to get money or data.";
const CTLOPT = [["factor2", "Multi-factor authentication"], ["training", "Security awareness training with phishing tests"],
  ["backup", "Offline backups tested by restore"], ["verify", "Verify requests through a second channel using contact details on file"],
  ["lockout", "Account lockout and rate limiting"], ["ddos", "DDoS protection from the hosting provider"],
  ["dlp", "Least-privilege access with download alerts"], ["encrypt", "Full-disk encryption and remote wipe"],
  ["waf", "Input validation and a web application firewall"]];
const THREATS = [
  { threat: "phish", ctl: "factor2", text: "A web store customer typed her password into a fake “Trailhead order status” page. The next day someone signed in to her account from overseas and changed the shipping address.",
    work: "With a second factor on customer accounts, a stolen password alone can't open the account.",
    traps: { training: "Training helps before the click; once a password is stolen, a second factor is what stops the sign-in." } },
  { threat: "phish", ctl: "training", text: "Three employees clicked a fake “shipment delayed” link last month, and Sam wants fewer people to fall for the next one.",
    work: "Practice with simulated phishing teaches people to spot and report it." },
  { threat: "ransom", ctl: "backup", text: "Overnight, files on the shared drive were encrypted and a note demanded payment in cryptocurrency.",
    work: "Clean offline backups let Trailhead restore without paying." },
  { threat: "imperson", ctl: "verify", text: "On a video call, someone who looks and sounds like Rob says he approves a $40,000 payment to a new supplier and asks Marcus to send it today. It was an AI-generated likeness.",
    work: "Calling Rob back on a known number would expose the fake." },
  { threat: "imperson", ctl: "verify", text: "An email that seems to be from Rob asks Elena to buy $2,000 in gift cards for a client event and send the codes.",
    work: "Confirming through a separate, known channel stops the impersonator." },
  { threat: "stuff", ctl: "lockout", alt: ["factor2"], text: "Thousands of login attempts a minute come from a handful of addresses, each trying an email and password leaked from other sites against the web store's customer login.",
    work: "Limiting repeated attempts stops automated guessing at scale; a second factor also blocks it.",
    altMsg: "A second factor is accepted too: it blocks sign-ins with leaked passwords. Lockout and rate limiting stop the flood of attempts itself." },
  { threat: "dos", ctl: "ddos", text: "The web store goes down on Black Friday under a flood of junk traffic.",
    work: "The host's DDoS protection filters the flood before it reaches the store." },
  { threat: "insider", ctl: "dlp", text: "A warehouse clerk whose job needs no customer data exports the full customer list with contact details.",
    work: "Limiting access to what the job needs, and alerting on big downloads, catches this." },
  { threat: "device", ctl: "encrypt", text: "A laptop with saved NetSuite reports is stolen from an employee's car.",
    work: "Encryption keeps the files unreadable and remote wipe erases them.",
    traps: { backup: "Backups restore lost data, but they don't stop a thief from reading it." } },
  { threat: "sqli", ctl: "waf", text: "An attacker types database commands into the web store's search box and pulls customer records.",
    work: "Validating input and filtering requests blocks injected commands." }];

// ---------- Part 5: NIST Cybersecurity Framework 2.0 functions ----------
const FNOPT = [["gv", "Govern"], ["id", "Identify"], ["pr", "Protect"], ["de", "Detect"], ["rs", "Respond"], ["rc", "Recover"]];
const DEVSRS = "Detect notices the incident; Respond acts on it.";
const NIST = [
  { ans: "gv", text: "Rob approves Trailhead's cybersecurity policy and makes Sam responsible for keeping it current.", work: "Setting policy and responsibility is Govern." },
  { ans: "gv", text: "Marcus and Rob decide how much cyber risk Trailhead will accept and review that choice each year.", work: "Setting risk tolerance is part of Govern." },
  { ans: "gv", text: "Trailhead adds security requirements to its contracts with the web store host and the payroll service.", work: "CSF 2.0 puts supply-chain risk management under Govern.",
    traps: { id: "CSF 2.0 moved supply-chain risk management into Govern." } },
  { ans: "id", text: "Sam keeps a list of every laptop, scanner and cloud service Trailhead uses.", work: "Knowing your assets is Identify." },
  { ans: "id", text: "Marcus ranks which data would hurt Trailhead most if exposed, such as customer lists and bank details.", work: "Judging what matters most is risk assessment, under Identify." },
  { ans: "id", text: "Sam reviews the monthly vulnerability scan of the web store and rates each finding.", work: "Finding and rating weaknesses is risk assessment, under Identify." },
  { ans: "pr", text: "Every employee completes security awareness training each spring.", work: "Training is a safeguard, under Protect." },
  { ans: "pr", text: "Staff laptops use full-disk encryption.", work: "Encryption protects data before anything goes wrong." },
  { ans: "pr", text: "The shared drive is backed up every night to storage kept offline.", work: "CSF 2.0 lists making and protecting backups under Protect.",
    traps: { rc: "Making backups protects data ahead of time (Protect); restoring them after an incident is Recover." } },
  { ans: "de", text: "Sam gets an alert when someone signs in to NetSuite from a new country.", work: "Spotting unusual activity is Detect." },
  { ans: "de", text: "Antivirus software scans laptops and alerts Sam when it finds malware.", work: "Monitoring for attacks is Detect." },
  { ans: "de", text: "Each morning Sam reviews the web store's logs for unusual traffic.", work: "Watching logs for signs of attack is Detect." },
  { ans: "rs", text: "After an employee clicks a phishing link, Sam disconnects the laptop from the network.", work: "Containing an incident in progress is Respond." },
  { ans: "rs", text: "Marcus notifies First Harbor Bank and Trailhead's insurer within a day of an incident, as the response plan requires.", work: "Communicating during an incident is Respond." },
  { ans: "rs", text: "Sam reviews the logs to work out how an attacker got in.", work: "Analyzing an incident is Respond." },
  { ans: "rc", text: "Sam restores the shared drive from last night's offline backup after a ransomware attack.", work: "Restoring operations is Recover.",
    traps: { pr: "Restoring backups after an incident is Recover; making and protecting them ahead of time is Protect." } },
  { ans: "rc", text: "After an outage, Marcus tells wholesale customers when ordering will be back.", work: "Communicating during restoration is Recover." },
  { ans: "rc", text: "Sam checks that restored files are complete and clean before staff use them again.", work: "Confirming a clean restore is part of Recover." }];

// Pairs that state opposite facts about the same control: [catalog of the first item ("A" Part 1, "D" Part 2), its index,
// the Part 2 index]. Three pairs sit within Part 2 and four pair a Part 1 situation with a Part 2 situation.
const CLASH = [["D", 4, 5], ["D", 6, 7], ["D", 11, 12], ["A", 6, 12], ["A", 9, 2], ["A", 10, 4], ["A", 12, 6]];

// ---------- Problem generator ----------
// Each part draws its catalog items with the spec's rules; the order drawn is the order shown. No numbers change.
function gen(seed) {
  const r = mulberry32(seed);
  let tries = 0;
  const draw = (n, k, ok) => {
    for (;;) {
      if (++tries > 50000) throw new Error("Could not generate a problem set");
      const xs = []; while (xs.length < k) { const i = Math.floor(r() * n); if (xs.indexOf(i) < 0) xs.push(i); }
      if (ok(xs)) return xs;
    }
  };
  const count = (xs, cat, key, v) => xs.filter(i => cat[i][key] === v).length;
  // Part 1: five situations, at least one from each area.
  const area = draw(AREAS.length, 5, xs => AREAOPT.every(o => count(xs, AREAS, "ans", o[0]) >= 1));
  // Part 2: four situations, at least one with no deficiency, at least two deficiencies, each deficiency with its own reason.
  // Situations that describe the same control two opposite ways never appear in one attempt (CLASH).
  const deficiency = draw(DEFS.length, 4, xs => {
    const yes = xs.filter(i => DEFS[i].def === "yes");
    return yes.length >= 2 && yes.length <= 3 && new Set(yes.map(i => DEFS[i].why)).size === yes.length &&
      !CLASH.some(c => (c[0] === "D" ? xs.indexOf(c[1]) >= 0 : area.indexOf(c[1]) >= 0) && xs.indexOf(c[2]) >= 0);
  });
  // Part 3: five controls, at least two of each answer.
  const soc = draw(SOCS.length, 5, xs => WHOOPT.every(o => count(xs, SOCS, "ans", o[0]) >= 2));
  // Part 4: three incidents with three different threats.
  const threats = draw(THREATS.length, 3, xs => new Set(xs.map(i => THREATS[i].threat)).size === 3);
  // Part 5: six activities from at least four functions, no more than two of any.
  const nist = draw(NIST.length, 6, xs => new Set(xs.map(i => NIST[i].ans)).size >= 4 && FNOPT.every(o => count(xs, NIST, "ans", o[0]) <= 2));
  return { area, deficiency, soc, threats, nist };
}

// ---------- Parts ----------
const optLabel = (opts, v) => { const o = opts.find(x => x[0] === v); return o ? o[1] : String(v); };
const not = (opts, v) => "Not “" + optLabel(opts, v) + ".” ";
function sel(id, label, opts, ans, work, wrong, row, col) { return { id, label, kind: "sel", opts, ans, work, wrong, row, col }; }
const trapOf = (x, v) => x.traps && Object.prototype.hasOwnProperty.call(x.traps, v) ? x.traps[v] + " " : "";
function buildParts(P) {
  const parts = [];

  // Part 1: which ITGC area.
  const as = P.area.map(i => AREAS[i]);
  parts.push({ id: "area", phase: "itgc", tick: "1", title: "Which ITGC area?", layout: "table", numbered: true,
    desc: "From Marcus Oyelaran, Controller: An IT auditor from Hartwell & Lowe is coming to talk with us about our systems. Get ready by sorting these situations. " +
      "Which IT general control area does each belong to, and is it a deficiency? Which controls do Oracle's SOC reports cover, and which must we run ourselves? " +
      "After Monday's class on cyber, match some threats to the controls that answer them, and place our security activities in the NIST Cybersecurity Framework.\n\n" +
      SCENARIO + "\n\nIT general controls (ITGCs) fall into three areas: access to programs and data, program change management, and computer operations. " +
      "For each situation, choose the area it belongs to. Parts 4 and 5 use Monday's cyber class, so graded mode opens after that class.",
    itemLabel: "Situation", cols: [{ key: "area", label: "ITGC area" }],
    items: as.map(a => ({ text: a.text })),
    fields: as.map((a, i) => sel("area" + i, "Situation " + (i + 1) + ": ITGC area", AREAOPT, a.ans, a.work, v =>
      not(AREAOPT, v) + AREAWHY[[v, a.ans].sort().join("-")] + " " + a.work, i, "area")),
    hint: "Who can get in (access), how the system is altered (change), or how it runs day to day (operations)?",
    why: "Application controls such as the three-way match only work if ITGCs keep the system secure, unchanged without approval and running.",
    walk: as.map((a, i) => ({ keys: ["area" + i], text: "Situation " + (i + 1) + ": " + a.work, formula: optLabel(AREAOPT, a.ans) })) });

  // Part 2: deficiency or not, and why.
  const ds = P.deficiency.map(i => DEFS[i]);
  parts.push({ id: "deficiency", phase: "itgc", tick: "2", title: "Deficiency or not?", layout: "table", numbered: true,
    desc: "Each situation shows an IT general control at work. Decide whether it shows a deficiency: a control that is missing, or that didn't work as it should. " +
      "Then choose the reason: the control worked as designed, or what went wrong.",
    itemLabel: "Situation", cols: [{ key: "def", label: "Deficiency" }, { key: "why", label: "Reason" }],
    items: ds.map(d => ({ text: d.text })),
    fields: ds.flatMap((d, i) => [
      sel("def" + i, "Situation " + (i + 1) + ": deficiency or not", DEFOPT, d.def,
        d.def === "yes" ? "The evidence shows the control didn't do its job, so it's a deficiency." : "The evidence shows the control doing its job, so there's no deficiency.",
        v => not(DEFOPT, v) + d.work + (d.def === "no" ? " " + WORKING : ""), i, "def"),
      sel("why" + i, "Situation " + (i + 1) + ": reason", WHYOPT, d.why, d.work,
        v => not(WHYOPT, v) + d.work + (d.def === "no" ? " " + WORKING : ""), i, "why")]),
    hint: "Ask what the control is meant to do, then whether the evidence shows it happened: approved, tested, followed up, limited.",
    why: "Auditors report ITGC deficiencies because they weaken every automated control that depends on the system.",
    walk: ds.map((d, i) => ({ keys: ["def" + i, "why" + i], text: "Situation " + (i + 1) + ": " + d.work,
      formula: optLabel(DEFOPT, d.def) + " · " + optLabel(WHYOPT, d.why) })) });

  // Part 3: the provider's control or Trailhead's.
  const os = P.soc.map(i => SOCS[i]);
  parts.push({ id: "soc", phase: "itgc", tick: "3", title: "Oracle's control or ours?", layout: "table", numbered: true,
    desc: "NetSuite is a cloud service that Oracle runs. Oracle's SOC reports cover the controls Oracle runs, and Trailhead's auditor relies on them. " +
      "Other controls only Trailhead can run. For each control, say who runs it.",
    itemLabel: "Control", cols: [{ key: "who", label: "Who runs it" }],
    items: os.map(o => ({ text: o.text })),
    fields: os.map((o, i) => sel("who" + i, "Control " + (i + 1) + ": who runs it", WHOOPT, o.ans, o.work, v =>
      not(WHOOPT, v) + (o.trap ? o.trap + " " : "") + o.work + (o.ans === "svc" ? " " + RELIES : ""), i, "who")),
    hint: "If it happens inside Oracle's data centers or software, the SOC reports cover it. If Trailhead decides, configures, reviews or reconciles it, Trailhead must run it.",
    why: "A SOC report covers only the provider's side; Trailhead's auditor still tests the controls Trailhead runs.",
    walk: os.map((o, i) => ({ keys: ["who" + i], text: "Control " + (i + 1) + ": " + o.work, formula: optLabel(WHOOPT, o.ans) })) });

  // Part 4: threats and the controls that answer them.
  const ts = P.threats.map(i => THREATS[i]);
  parts.push({ id: "threats", phase: "cyber", tick: "4", title: "Threats and the controls that answer them", layout: "table", numbered: true,
    desc: "This part uses Monday's class on cyber. For each incident, name the threat, then choose the control that would best stop it or limit the damage.",
    itemLabel: "Incident", cols: [{ key: "threat", label: "Threat" }, { key: "ctl", label: "Control that answers it" }],
    items: ts.map(t => ({ text: t.text })),
    fields: ts.flatMap((t, i) => [
      sel("threat" + i, "Incident " + (i + 1) + ": threat", THREATOPT, t.threat, THREATWHY[t.threat], v =>
        not(THREATOPT, v) + ([v, t.threat].sort().join("-") === "imperson-phish" ? PHISHVSIMP : THREATWHY[t.threat]), i, "threat"),
      Object.assign(sel("ctl" + i, "Incident " + (i + 1) + ": control", CTLOPT, t.ctl, t.work, v => not(CTLOPT, v) + trapOf(t, v) + t.work, i, "ctl"),
        t.alt ? { alt: t.alt, altMsg: t.altMsg } : {})]),
    hint: "Name the attack by how it works, then pick the control that breaks that step.",
    why: "Cyber risks threaten the accuracy and confidentiality of accounting data, so they belong in internal control.",
    walk: ts.map((t, i) => ({ keys: ["threat" + i, "ctl" + i], text: "Incident " + (i + 1) + ": " + THREATWHY[t.threat] + " " + t.work,
      formula: optLabel(THREATOPT, t.threat) + " · " + optLabel(CTLOPT, t.ctl) })) });

  // Part 5: NIST CSF 2.0 functions.
  const ns = P.nist.map(i => NIST[i]);
  parts.push({ id: "nist", phase: "cyber", tick: "5", title: "NIST CSF 2.0 functions", layout: "table", numbered: true,
    desc: "The NIST Cybersecurity Framework (CSF) 2.0 sorts a cyber program into six functions. For each of Trailhead's security activities, choose the function it belongs to.",
    itemLabel: "Activity", cols: [{ key: "fn", label: "CSF 2.0 function" }],
    items: ns.map(n => ({ text: n.text })),
    fields: ns.map((n, i) => sel("fn" + i, "Activity " + (i + 1) + ": CSF function", FNOPT, n.ans, n.work, v => {
      const dr = [v, n.ans].sort().join("-") === "de-rs";
      return not(FNOPT, v) + (trapOf(n, v) || (dr ? DEVSRS + " " : "")) + n.work;
    }, i, "fn")),
    hint: "Govern sets direction; Identify knows what you have; Protect prevents; Detect notices; Respond acts; Recover restores.",
    why: "CSF 2.0 gives Trailhead and its auditors a shared map of what a cyber program should cover.",
    walk: ns.map((n, i) => ({ keys: ["fn" + i], text: "Activity " + (i + 1) + ": " + n.work, formula: optLabel(FNOPT, n.ans) })) });
  return parts;
}

// ---------- Grading ----------
// Every field is a choice: right, or "Not “label.”" with the reason. A blank or unknown choice reads as unchosen.
function grade(p, vals) {
  const res = {}; let all = true;
  p.fields.forEach(f => {
    const raw = vals[f.id], v = typeof raw === "string" ? raw : "";
    if (!v || !f.opts.some(o => o[0] === v)) res[f.id] = { ok: false, msg: "Choose an answer." };
    else res[f.id] = v === f.ans ? { ok: true, msg: "Correct." } : (f.alt || []).indexOf(v) >= 0 ? { ok: true, msg: "Correct. " + f.altMsg } : { ok: false, msg: f.wrong(v, vals) };
    if (!res[f.id].ok) all = false;
  });
  return { res, all };
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function dtab(caption, cols, rows) {
  return '<div class="scroll" style="margin-top:12px"><table class="dtab"><caption><div class="cap-name">' + esc(caption) + '</div></caption><thead><tr>' +
    cols.map(c => '<th scope="col">' + esc(c) + '</th>').join("") + '</tr></thead><tbody>' +
    rows.map(row => '<tr>' + row.map((x, i) => i === 0 ? '<th scope="row">' + esc(x) + '</th>' : '<td>' + esc(x) + '</td>').join("") + '</tr>').join("") + '</tbody></table></div>';
}
