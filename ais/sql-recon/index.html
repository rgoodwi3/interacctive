<script>
"use strict";
// ACCT 2250 IL6: Queries, Joins and Reconciliation. Graded on the server by the lab-attempt edge function
// (fa-lab-platform, slug ais-sql-recon), which runs a copy of the code between the LAB markers below.
// Trailhead Outfitters Co. is fictional; every row here is made up for practice. The lab prints no years in its
// text: dates follow a fixed Jan-Feb calendar. Access date literals carry the year, so it appears inside SQL code only.
let YEAR = new Date().getFullYear();
/* ==== LAB BEGIN: copied verbatim into fa-lab-platform/supabase/functions/_shared/labs/ais-sql-recon.ts ==== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const cc = a => String.fromCharCode.apply(null, a);
const RSV = { ids: [cc([67, 45, 49, 48, 53]), cc([67, 45, 49, 48, 56])], no: cc([55, 55, 51, 49]) };
const comma = n => Math.abs(n).toLocaleString("en-US");
const money = n => (n < 0 ? "−" : "") + "$" + comma(n);
function parse(v) {
  const s = String(v == null ? "" : v).replace(/[$,%\s]/g, "").replace(/^\((.*)\)$/, "-$1").replace(/^−/, "-");
  if (s === "") return null;
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
// Amounts and numbers the lab never shows.
const bad = x => { const a = Math.abs(x); return (a >= 480 && a <= 498) || money(a).indexOf("$102") >= 0 || String(a).indexOf(RSV.no) >= 0; };
const hasRsv = o => JSON.stringify(o).replace(/(\d),(?=\d)/g, "$1").indexOf(RSV.no) >= 0;

// Trailhead's wholesale customers (CustomerID, CustomerName, City, State).
const CUSTOMERS = [
  ["C-101", "Granite Peak Mercantile", "Burlington", "VT"], ["C-102", "Northfork Adventure Co.", "Lake Placid", "NY"],
  ["C-103", "Summit & Stream Co.", "North Conway", "NH"], ["C-104", "Harborview Outdoor Supply", "Portland", "ME"],
  [RSV.ids[0], "Laurel Ridge Outdoors", "State College", "PA"], ["C-106", "Tidewater Trail Shop", "Annapolis", "MD"],
  ["C-107", "Blue Heron Sports", "Ithaca", "NY"], [RSV.ids[1], "Stonewall Scout Supply", "Worcester", "MA"],
  ["C-109", "Pine Barrens Outfitters", "Toms River", "NJ"], ["C-110", "Catamount Gear Exchange", "Montpelier", "VT"],
  ["C-111", "Elm City Bike & Hike", "New Haven", "CT"], ["C-112", "Kettle Pond Camping", "Providence", "RI"]];
const STATES = { NY: "New York", NH: "New Hampshire", NJ: "New Jersey", MA: "Massachusetts", MD: "Maryland", ME: "Maine" };
// The Item table: SKU, Description, WholesalePrice.
const ITEMS = [
  ["TNT-2P", "Two-person tent", 120], ["TNT-4P", "Four-person tent", 199], ["TRP-UL", "Ultralight tarp", 39],
  ["SLB-20", "Sleeping bag, 20°F", 99], ["SLB-40", "Sleeping bag, 40°F", 62], ["PAD-IN", "Insulated sleeping pad", 54],
  ["PCK-65", "Backpack, 65 L", 145], ["PCK-28", "Daypack, 28 L", 58], ["DRY-20", "Dry sack, 20 L", 13],
  ["BT-MID", "Mid hiking boot", 108], ["BT-TRL", "Trail shoe", 84], ["SCK-3P", "Merino socks, 3-pack", 17],
  ["STV-1B", "Single-burner stove", 42], ["CKS-2", "Two-person cook set", 34], ["FLT-SQ", "Squeeze water filter", 29],
  ["BTL-1L", "Insulated bottle, 1 L", 15], ["JKT-RN", "Rain jacket", 78], ["HDL-30", "Headlamp", 20],
  ["PLE-TK", "Trekking poles, pair", 48], ["FAK-1", "First-aid kit", 16]];
const VENDORS = [["V-202", "Cascade Loft Textiles"], ["V-203", "Ironwood Pack Works"], ["V-204", "Tamarack Footwear Ltd."], ["V-205", "Ember Camp Equipment"], ["V-206", "Brightline Gear"]];
const vname = id => VENDORS.find(v => v[0] === id)[1];
// Business days Jan 5-Feb 5 on Trailhead's fixed calendar (Jan 1 is a Friday), without the Jan 18 holiday.
// A day is a number: 5 = Jan 5, 32 = Feb 1.
const DAYS = [];
for (let n = 5; n <= 36; n++) { const w = (4 + n) % 7; if (w > 0 && w < 6 && n !== 18) DAYS.push(n); }
const dayName = n => n > 31 ? "Feb " + (n - 31) : "Jan " + n;
const lit = n => "#" + (n > 31 ? "2/" + (n - 31) : "1/" + n) + "/2027#";
// Quantities by price: $90 or more by 2 (2-40); $40-$89 by 6 (6-96); under $40 by 12 (12-144).
const qsteps = p => { const out = [], st = p >= 90 ? 2 : p >= 40 ? 6 : 12, hi = p >= 90 ? 40 : p >= 40 ? 96 : 144; for (let q = st; q <= hi; q += st) out.push(q); return out; };
const CAUSES = [["timing", "Timing: entered after the refresh"], ["criteria", "Query error: date criteria"], ["joinout", "Query error: join leaves rows out"],
  ["joinrep", "Query error: join repeats rows"], ["none", "Not a reconciling item"]];
const CLAUSES = [["where", "In WHERE"], ["having", "In HAVING"], ["group", "In GROUP BY"], ["order", "In ORDER BY"]];
const PAIRS = {
  J1: { P: "Invoice", C: "ReceiptApplication", pk: "InvoiceID", ck: "ReceiptID", one: "invoice", many: "invoices", row: "payment row", rows: "payment rows", unm: "invoices with no payment",
    pcols: ["InvoiceID", "CustomerID", "InvoiceDate", "Amount"], ccols: ["ReceiptID", "InvoiceID", "AmountApplied"] },
  J2: { P: "Customer", C: "SalesOrder", pk: "CustomerID", ck: "SalesOrderID", one: "customer", many: "customers", row: "sales order", rows: "sales orders", unm: "customers with no sales orders",
    pcols: ["CustomerID", "CustomerName", "City", "State"], ccols: ["SalesOrderID", "CustomerID", "OrderDate"] },
  J3: { P: "Item", C: "SalesOrderLine", pk: "SKU", ck: "SalesOrderID", one: "item", many: "items", row: "order line", rows: "order lines", unm: "items with no order lines",
    pcols: ["SKU", "Description", "WholesalePrice"], ccols: ["SalesOrderID", "LineNumber", "SKU", "Quantity"] }};
const joinSQL = (J, how) => "SELECT " + J.P + "." + J.pk + ", " + J.C + "." + J.ck + "\nFROM " + J.P + " " + how + " JOIN " + J.C + "\n  ON " + J.P + "." + J.pk + " = " + J.C + "." + J.pk + ";";
const WINDOWS = [[11, 22], [11, 29], [19, 36], [25, 36]];

// ---------- Problem generator ----------
function gen(seed) {
  const r = mulberry32(seed);
  const R = (a, b) => a + Math.floor(r() * (b - a + 1));
  const one = xs => xs[Math.floor(r() * xs.length)];
  const shuffle = xs => { const a = xs.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const sample = (xs, k) => shuffle(xs).slice(0, k);
  // Document numbers are distinct within a problem: each part draws from what earlier parts left.
  const taken = new Set();
  const nums = (k, lo, hi) => { const out = []; while (out.length < k) { const x = R(lo, hi); if (!taken.has(x) && out.indexOf(x) < 0) out.push(x); } return out.sort((a, b) => a - b); };
  const keep = xs => xs.forEach(x => taken.add(x));
  const fail = () => { throw new Error("Could not generate a problem set"); };
  // One of the two reserved customers is left out of the problem; Parts 3 (J1) and 5 leave out both.
  const excl = r() < 0.5 ? 0 : 1;
  const custs = CUSTOMERS.filter(c => c[0] !== RSV.ids[excl]);
  const pool = CUSTOMERS.filter(c => RSV.ids.indexOf(c[0]) < 0);

  // ---- Part 1: what does this query return? ----
  const tpl = one(["T1", "T2", "T3"]), desc = r() < 0.7;
  let p1, k1;
  for (let t = 0; t < 50000 && !p1; t++) {
    const so = nums(3, 190000, 199999), rows = [];
    [3, 3, 2].forEach((n, o) => sample(ITEMS, n).forEach((it, j) => { const q = one(qsteps(it[2])); rows.push({ i: rows.length + 1, so: "SO-" + so[o], ln: j + 1, sku: it[0], q, p: it[2], t: q * it[2] }); }));
    if (new Set(rows.map(x => x.t)).size < 8 || rows.some(x => bad(x.t))) continue;
    let f, where, x = {}, traps;
    if (tpl === "T1") {
      const P = one(["S", "P", "B", "T"]), m = rows.filter(y => y.sku.startsWith(P));
      if (m.length < 3) continue;
      const q = one(m).q;
      f = y => y.sku.startsWith(P) && y.q >= q;
      if (!m.some(y => y.q < q) || !rows.some(y => !y.sku.startsWith(P) && y.q >= q)) continue;
      where = 'WHERE SKU LIKE "' + P + '*" AND Quantity >= ' + q;
      const n = rows.filter(f).length;
      x = { P, q, miss: m.find(y => y.q < q).i, edge: m.find(y => y.q === q).i };
      traps = [m.length, n - 1, 8];
    } else if (tpl === "T2") {
      const p = one(rows).p, q = one(rows).q;
      f = y => y.p >= p || y.q > q;
      const pOnly = rows.filter(y => y.p >= p && y.q <= q), qOnly = rows.filter(y => y.p < p && y.q > q), eqQ = rows.filter(y => y.q === q && y.p < p);
      const pEdge = rows.filter(y => y.p === p && y.q <= q);
      if (!pOnly.length || !qOnly.length || !eqQ.length || !pEdge.length) continue;
      where = "WHERE UnitPrice >= " + p + " OR Quantity > " + q;
      const n = rows.filter(f).length;
      x = { p, q, eqQ: eqQ[0].i, pOnly: pOnly[0].i, pEdge: pEdge[0].i };
      traps = [n + eqQ.length, rows.filter(y => y.p >= p && y.q > q).length, n - pEdge.length, 8];
    } else {
      const skus = rows.map(y => y.sku).filter((s, i, a) => a.indexOf(s) === i), ins = sample(skus, 3);
      const th = one([500, 1000, 1500, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000]);
      f = y => ins.indexOf(y.sku) >= 0 && y.t > th;
      if (rows.some(y => y.t === th)) continue;
      const inLow = rows.filter(y => ins.indexOf(y.sku) >= 0 && y.t < th), outHigh = rows.filter(y => ins.indexOf(y.sku) < 0 && y.t > th);
      if (!inLow.length || !outHigh.length) continue;
      where = 'WHERE SKU IN ("' + ins.join('", "') + '")\n  AND Quantity * UnitPrice > ' + th;
      x = { ins, th, inLow: inLow[0].i, outHigh: outHigh[0].i };
      traps = [rows.filter(y => ins.indexOf(y.sku) >= 0).length, rows.filter(y => y.t > th).length, 8];
    }
    const ret = rows.filter(f), n = ret.length, lo = tpl === "T2" ? 3 : 2, hi = tpl === "T1" ? 4 : tpl === "T2" ? 5 : 3;
    if (n < lo || n > hi) continue;
    if (traps.indexOf(n) >= 0 || new Set(traps).size < traps.length) continue;
    const top = rows.reduce((a, b) => b.t > a.t ? b : a);
    if (f(top)) continue;
    const order = ret.slice().sort((a, b) => desc ? b.t - a.t : a.t - b.t);
    if (order[0] === ret[0]) continue;
    const qx = ret.reduce((a, b) => (desc ? b.q > a.q : b.q < a.q) ? b : a);
    if (qx === order[0] || ret.filter(y => y.q === qx.q).length > 1) continue;
    // The first and last rows' Quantity and UnitPrice never equal a line total, so each wrong number has one reading.
    const ends = [order[0], order[order.length - 1]];
    if (ends.some(e => rows.some(y => y.t === e.q || y.t === e.p))) continue;
    const sql = "SELECT SalesOrderID, LineNumber, SKU,\n  Quantity * UnitPrice AS LineTotal\nFROM SalesOrderLine\n" + where + "\nORDER BY Quantity * UnitPrice" + (desc ? " DESC" : "") + ";";
    const pub = { rows: rows.map(y => [y.so, String(y.ln), y.sku, String(y.q), money(y.p)]), sql };
    if (hasRsv(pub)) continue;
    keep(so); p1 = pub;
    k1 = Object.assign({ tpl, desc, rows, ret: ret.map(y => y.i), order: order.map(y => y.i), top: top.i, qx: qx.i, traps }, x);
  }
  if (!p1) fail();

  // ---- Part 2: turn requests into criteria ----
  const picks = shuffle(["W1", "W2"].concat(sample(["W3", "W4", "W5", "W6"], 3)));
  const kinds = { W1: ["ok", "or", "name", "due"], W2: ["ok", "prec", "both", "inor"], W3: ["ok", "eq", "desc", "in"], W4: ["ok", "name", "city", "like"], W5: ["ok", "or", "in", "due"], W6: ["ok", "or", "strict", "in"] };
  const k2 = picks.map(w => {
    let v;
    if (w === "W1") { const c = one(custs); v = { c: c[0], name: c[1], d: one(DAYS.filter(n => n >= 11 && n <= 32)) }; }
    else if (w === "W2") { const vs = sample(VENDORS.map(x => x[0]), 2).sort(); v = { v1: vs[0], v2: vs[1], X: one([1500, 2500, 5000, 7500, 10000]) }; }
    else if (w === "W3") { const x = one([["TNT", "tents"], ["SLB", "sleeping bags"], ["PCK", "packs"], ["BT-", "boots and trail shoes"]]); v = { P: x[0], words: x[1] }; }
    else if (w === "W4") v = { st: one(["NY", "NH", "NJ", "MA", "MD", "ME"]) };
    else if (w === "W5") { const ab = one([[11, 15], [25, 29], [32, 36]]); v = { v: one(VENDORS)[0], a: ab[0], b: ab[1] }; }
    else { const X = one([1500, 2500, 5000]); v = { X, Y: X + one([3000, 5000, 7500]) }; }
    return { w, v, order: shuffle(kinds[w]) };
  });
  // The data panel shows each table the requests use: its columns and two sample rows (made-up document numbers).
  const used = ["Invoice", "VendorBill", "Item", "Customer"].filter(tb => picks.some(w => ({ W1: "Invoice", W2: "VendorBill", W3: "Item", W4: "Customer", W5: "VendorBill", W6: "Invoice" })[w] === tb));
  let p2;
  for (let t = 0; t < 50000 && !p2; t++) {
    const docs = [], tables = used.map(tb => {
      if (tb === "Invoice") {
        const inv = nums(2, 290000, 299999), so = nums(2, 190000, 199999), ds = sample(DAYS.filter(n => n <= 29), 2).sort((a, b) => a - b), cs = sample(custs, 2);
        docs.push(...inv, ...so);
        return { name: tb, columns: ["InvoiceID", "SalesOrderID", "CustomerID", "InvoiceDate", "DueDate", "Amount"], sample: [0, 1].map(i => ["INV-" + inv[i], "SO-" + so[i], cs[i][0], dayName(ds[i]), dayName(ds[i] + 30), money(R(1000, 9800))]) };
      }
      if (tb === "VendorBill") {
        const bl = nums(2, 69000, 69999), ds = sample(DAYS.filter(n => n <= 29), 2).sort((a, b) => a - b), vs = sample(VENDORS, 2);
        docs.push(...bl);
        return { name: tb, columns: ["BillID", "VendorID", "BillDate", "DueDate", "Amount"], sample: [0, 1].map(i => ["BL-" + bl[i], vs[i][0], dayName(ds[i]), dayName(ds[i] + 30), money(R(1000, 9800))]) };
      }
      if (tb === "Item") return { name: tb, columns: ["SKU", "Description", "WholesalePrice"], sample: sample(ITEMS, 2).map(x => [x[0], x[1], money(x[2])]) };
      return { name: tb, columns: ["CustomerID", "CustomerName", "City", "State"], sample: sample(custs, 2).sort().map(c => c.slice()) };
    });
    const pub = { tables };
    if (hasRsv(pub) || tables.some(tb => tb.sample.some(row => row.some(c => /^\$/.test(c) && bad(parse(c)))))) { continue; }
    keep(docs); p2 = pub;
  }
  if (!p2) fail();

  // ---- Part 3: INNER and LEFT joins ----
  const pair = one(["J1", "J2", "J3"]), J = PAIRS[pair];
  let p3, k3;
  for (let t = 0; t < 50000 && !p3; t++) {
    let parent, child, counts, docs = [];
    if (pair === "J1") {
      // One check pays two invoices of the same customer; 3 - u invoices are paid in two payments.
      const n = R(5, 6), u = R(1, 2), m = n - u, idx = shuffle([0, 1, 2, 3, 4, 5].slice(0, n)), matched = idx.slice(0, m), two = matched.slice(0, 3 - u);
      const sh = sample(matched, 2), cs = sample(pool, n - 1), cust = [];
      let k = 0;
      for (let i = 0; i < n; i++) if (i !== sh[1]) cust[i] = cs[k++];
      cust[sh[1]] = cust[sh[0]];
      const inv = nums(n, 290000, 299999);
      parent = inv.map((x, i) => ({ id: "INV-" + x, c: cust[i][0], d: one(DAYS.filter(y => y <= 29)), a: R(1200, 9800) }));
      if (parent.some(x => bad(x.a))) continue;
      const lines = [];
      matched.forEach(i => { const a = parent[i].a; if (two.indexOf(i) >= 0) { const s = R(300, a - 300); lines.push([i, s], [i, a - s]); } else lines.push([i, a]); });
      if (lines.some(l => bad(l[1]))) continue;
      const rc = nums(lines.length, 490000, 499999);
      child = lines.map((l, j) => ({ rc: "RC-" + rc[j], i: l[0], a: l[1] }));
      child.find(y => y.i === sh[1]).rc = child.find(y => y.i === sh[0]).rc;
      child.sort((a, b) => a.rc < b.rc ? -1 : a.rc > b.rc ? 1 : parent[a.i].id < parent[b.i].id ? -1 : 1);
      counts = parent.map((_, i) => child.filter(y => y.i === i).length);
      docs = inv.concat(rc);
      parent = parent.map(x => [x.id, x.c, dayName(x.d), money(x.a)]);
      child = child.map(y => [y.rc, parent[y.i][0], money(y.a)]);
    } else {
      const u = R(1, 2), m = 5 - u, c = R(6, 8), cnt = [];
      for (let i = 0; i < m; i++) cnt.push(1);
      for (let i = m; i < c; i++) cnt[R(0, m - 1)]++;
      const mx = Math.max.apply(null, cnt);
      if (mx > 3 || cnt.filter(y => y === mx).length !== 1) continue;
      const idx = shuffle([0, 1, 2, 3, 4]);
      counts = [0, 0, 0, 0, 0];
      idx.slice(0, m).forEach((i, k) => { counts[i] = cnt[k]; });
      const list = shuffle([].concat.apply([], counts.map((k, i) => Array(k).fill(i))));
      if (pair === "J2") {
        const cs = sample(custs, 5).sort((a, b) => a[0] < b[0] ? -1 : 1), so = nums(c, 190000, 199999), ds = sample(DAYS, c).sort((a, b) => a - b);
        parent = cs.map(x => x.slice());
        child = list.map((i, k) => ["SO-" + so[k], parent[i][0], dayName(ds[k])]);
        docs = so;
      } else {
        const its = sample(ITEMS, 5), so = nums(3, 190000, 199999);
        parent = its.map(x => [x[0], x[1], money(x[2])]);
        const asg = list.map(() => one(so));
        if (new Set(asg).size < 3 || new Set(asg.map((s, k) => s + "|" + list[k])).size < list.length) continue;
        const lines = list.map((i, k) => ({ so: asg[k], i })).sort((a, b) => a.so - b.so);
        const ln = {};
        child = lines.map(l => { ln[l.so] = (ln[l.so] || 0) + 1; return ["SO-" + l.so, String(ln[l.so]), its[l.i][0], String(one(qsteps(its[l.i][2])))]; });
        docs = so;
      }
    }
    const pub = { pair, parent: { table: J.P, columns: J.pcols, rows: parent }, child: { table: J.C, columns: J.ccols, rows: child }, q1: joinSQL(J, "INNER"), q2: joinSQL(J, "LEFT") };
    if (hasRsv(pub)) continue;
    const n = parent.length, mx = Math.max.apply(null, counts), ones = counts.map((k, i) => k === 1 ? i : -1).filter(i => i >= 0);
    const X = r() < 0.6 || !ones.length ? one(counts.map((k, i) => k === mx ? i : -1).filter(i => i >= 0)) : one(ones);
    keep(docs); p3 = pub;
    k3 = { counts, X, xmax: counts.indexOf(mx), n, c: child.length, u: counts.filter(k => k === 0).length, find: shuffle(["ok", "inner", "eq", "pk"]) };
  }

// Choices: right, or "Not “label.”" with the reason; a blank or unknown choice reads as unchosen. Numbers: whole numbers,
// exact; the wrong-answer reason may look at the student's other answers in the part (follow-through).
function grade(p, vals) {
  const nums = {}; p.fields.forEach(f => { if (f.kind !== "sel") { const v = parse(vals[f.id]); nums[f.id] = v === null || isNaN(v) ? null : v; } });
  const res = {}; let all = true;
  p.fields.forEach(f => {
    const raw = vals[f.id];
    if (f.kind === "sel") {
      const v = typeof raw === "string" ? raw : "";
      if (!v || !f.opts.some(o => o[0] === v)) res[f.id] = { ok: false, msg: "Choose an answer." };
      else res[f.id] = v === f.ans ? { ok: true, msg: "Correct." } : { ok: false, msg: f.wrong(v) };
    } else {
      const v = parse(raw);
      if (v === null) res[f.id] = { ok: false, msg: "Enter an amount." };
      else if (isNaN(v)) res[f.id] = { ok: false, msg: "Enter a number only, like 2400 or 12.50." };
      else res[f.id] = v === f.ans ? { ok: true, msg: "Correct." } : { ok: false, msg: f.wrong(v, nums, vals) };
    }
    if (!res[f.id].ok) all = false;
  });
  return { res, all };
}
