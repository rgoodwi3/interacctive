<script>
"use strict";
// ACCT 2250 IL4: Keys, Relationships and Cardinality. Graded on the server by the lab-attempt edge function
// (fa-lab-platform, slug ais-keys-cardinality), which runs a copy of the code between the LAB markers below.
// Trailhead Outfitters Co. is fictional. Every business rule here is true of Trailhead's data; document numbers are
// made up for practice. The lab prints no years: dates follow a fixed Jan-Feb calendar.
let YEAR = new Date().getFullYear();
/* ==== LAB BEGIN: copied verbatim into fa-lab-platform/supabase/functions/_shared/labs/ais-keys-cardinality.ts ==== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const money = n => "$" + n.toLocaleString("en-US");
const cc = a => String.fromCharCode.apply(null, a);
const RSV = { ids: [cc([67, 45, 49, 48, 53]), cc([67, 45, 49, 48, 56])], no: cc([55, 55, 51, 49]) };

// Trailhead's customers (the Customer table's 13 rows).
const CUSTOMERS = [
  ["C-101", "Granite Peak Mercantile"], ["C-102", "Northfork Adventure Co."], ["C-103", "Summit & Stream Co."],
  ["C-104", "Harborview Outdoor Supply"], ["C-105", "Laurel Ridge Outdoors"], ["C-106", "Tidewater Trail Shop"],
  ["C-107", "Blue Heron Sports"], ["C-108", "Stonewall Scout Supply"], ["C-109", "Pine Barrens Outfitters"],
  ["C-110", "Catamount Gear Exchange"], ["C-111", "Elm City Bike & Hike"], ["C-112", "Kettle Pond Camping"],
  ["C-900", "Web Store Sales"]];
const WHOLESALE = CUSTOMERS.slice(0, 12).map(c => c[0]);
// The Item table: SKU, description, vendor (given for the items the sample rows use), standard cost, wholesale price.
const ITEMS = [
  ["TNT-2P", "Two-person tent", "", 70, 120], ["TNT-4P", "Four-person tent", "", 118, 199], ["TRP-UL", "Ultralight tarp", "", 22, 39],
  ["SLB-20", "Sleeping bag, 20°F", "V-202", 58, 99], ["SLB-40", "Sleeping bag, 40°F", "V-202", 36, 62], ["PAD-IN", "Insulated sleeping pad", "V-202", 31, 54],
  ["PCK-65", "Backpack, 65 L", "V-203", 84, 145], ["PCK-28", "Daypack, 28 L", "V-203", 33, 58], ["DRY-20", "Dry sack, 20 L", "V-203", 7, 13],
  ["BT-MID", "Mid hiking boot", "V-204", 62, 108], ["BT-TRL", "Trail shoe", "V-204", 48, 84], ["SCK-3P", "Merino socks, 3-pack", "V-204", 9, 17],
  ["STV-1B", "Single-burner stove", "V-205", 24, 42], ["CKS-2", "Two-person cook set", "V-205", 19, 34], ["FLT-SQ", "Squeeze water filter", "V-205", 16, 29],
  ["BTL-1L", "Insulated bottle, 1 L", "V-205", 8, 15], ["JKT-RN", "Rain jacket", "V-206", 44, 78], ["HDL-30", "Headlamp", "V-206", 11, 20],
  ["PLE-TK", "Trekking poles, pair", "V-206", 27, 48], ["FAK-1", "First-aid kit", "V-206", 9, 16]];
const VENDORS = ["V-202", "V-203", "V-204", "V-205", "V-206"];
// Business days Jan 5-Feb 26 on Trailhead's fixed calendar (Jan 1 is a Friday), without the Jan 18 holiday.
const DAYS = [];
for (let n = 5; n <= 57; n++) { const w = (4 + n) % 7, feb = n > 31, d = feb ? n - 31 : n; if (w > 0 && w < 6 && !(!feb && d === 18)) DAYS.push((feb ? "Feb " : "Jan ") + d); }

// Each table's name, its key, how it reads in a sentence, and the one-line description the data panel shows.
const T = {
  Customer: { key: "CustomerID", one: "customer", many: "customers", about: "One row per customer" },
  SalesOrder: { key: "SalesOrderID", one: "sales order", many: "sales orders", about: "One row per customer order" },
  SalesOrderLine: { key: "SalesOrderID + LineNumber", one: "sales order line", many: "sales order lines", about: "One row per line of a sales order" },
  Item: { key: "SKU", one: "item", many: "items", about: "One row per product Trailhead stocks" },
  Shipment: { key: "ShipmentID", one: "shipment", many: "shipments", about: "One row per shipment of an order (NetSuite's item fulfillment)" },
  Invoice: { key: "InvoiceID", one: "invoice", many: "invoices", about: "One row per customer invoice" },
  CashReceipt: { key: "ReceiptID", one: "cash receipt", many: "cash receipts", about: "One row per customer payment received" },
  Vendor: { key: "VendorID", one: "vendor", many: "vendors", about: "One row per vendor, for inventory and for expenses such as rent" },
  PurchaseOrder: { key: "PurchaseOrderID", one: "purchase order", many: "purchase orders", about: "One row per purchase order to a vendor" },
  ItemReceipt: { key: "ItemReceiptID", one: "item receipt", many: "item receipts", about: "One row per delivery received against a purchase order" },
  JournalEntry: { key: "EntryID", one: "journal entry", many: "journal entries", about: "One row per journal entry" },
  JournalLine: { key: "EntryID + LineNumber", one: "journal line", many: "journal lines", about: "One row per debit or credit line of a journal entry" },
  VendorBill: { key: "BillID", one: "vendor bill", many: "vendor bills", about: "One row per vendor bill" }};
const an = w => (/^[aeiou]/i.test(w) ? "an " : "a ") + w;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- Part 1: keys in one table ----------
const ROLE = [["pk", "Primary key"], ["pkpart", "Part of the primary key"], ["pkfk", "Part of the primary key and a foreign key"], ["fk", "Foreign key"], ["none", "Not a key"]];
const KEYTABS = [
  { table: "SalesOrderLine", cols: ["SalesOrderID", "LineNumber", "SKU", "Quantity", "UnitPrice"], ans: ["pkfk", "pkpart", "fk", "none", "none"],
    parent: { SalesOrderID: "SalesOrder", SKU: "Item" }, doc: "order" },
  { table: "PurchaseOrderLine", cols: ["PurchaseOrderID", "LineNumber", "SKU", "QuantityOrdered", "UnitCost"], ans: ["pkfk", "pkpart", "fk", "none", "none"],
    parent: { PurchaseOrderID: "PurchaseOrder", SKU: "Item" }, doc: "purchase order" },
  { table: "Invoice", cols: ["InvoiceID", "SalesOrderID", "CustomerID", "InvoiceDate", "Amount"], ans: ["pk", "fk", "fk", "none", "none"],
    parent: { SalesOrderID: "SalesOrder", CustomerID: "Customer" } },
  { table: "CashReceipt", cols: ["ReceiptID", "CustomerID", "ReceiptDate", "Amount", "Method"], ans: ["pk", "fk", "none", "none", "none"],
    parent: { CustomerID: "Customer" } },
  { table: "Item", cols: ["SKU", "Description", "VendorID", "StandardCost", "WholesalePrice"], ans: ["pk", "none", "fk", "none", "none"],
    parent: { VendorID: "Vendor" } },
  { table: "VendorBill", cols: ["BillID", "VendorID", "PurchaseOrderID", "VendorBillNumber", "Amount"], ans: ["pk", "fk", "fk", "none", "none"],
    parent: { VendorID: "Vendor", PurchaseOrderID: "PurchaseOrder" } }];
const BLANKFK = "A foreign key may be blank when the relationship is optional; rent bills have no PO.";

// ---------- Part 2: relationships and the business rules behind them (all true of Trailhead's data) ----------
// ab = how many B rows one A row has (min, max); ba = how many A rows one B row has.
const REL = [
  { id: "R1", a: "Customer", b: "SalesOrder", rule: "Trailhead sets up a customer when its credit application is approved, often before the first order. Every sales order is for exactly one customer.", ab: ["0", "many"], ba: ["1", "1"] },
  { id: "R2", a: "SalesOrder", b: "SalesOrderLine", rule: "NetSuite won't save an order without at least one line. Each line belongs to exactly one order.", ab: ["1", "many"], ba: ["1", "1"] },
  { id: "R3", a: "Item", b: "SalesOrderLine", rule: "New items are added before they're ever sold. Each order line is for exactly one item.", ab: ["0", "many"], ba: ["1", "1"] },
  { id: "R4", a: "SalesOrder", b: "Shipment", rule: "Each order ships complete in one shipment, and an order may not have shipped yet. Each shipment is for exactly one order.", ab: ["0", "1"], ba: ["1", "1"] },
  { id: "R5", a: "Customer", b: "CashReceipt", rule: "A new customer may not have paid anything yet. Each receipt comes from exactly one customer.", ab: ["0", "many"], ba: ["1", "1"] },
  { id: "R6", a: "Vendor", b: "Item", rule: "Expense vendors such as the landlord supply no items. Each item comes from exactly one vendor.", ab: ["0", "many"], ba: ["1", "1"] },
  { id: "R7", a: "Vendor", b: "PurchaseOrder", rule: "A vendor may have no purchase orders yet. Each purchase order goes to exactly one vendor.", ab: ["0", "many"], ba: ["1", "1"] },
  { id: "R8", a: "PurchaseOrder", b: "ItemReceipt", rule: "Each PO arrives in one delivery, and a PO may not have arrived yet. Each receipt is against exactly one PO.", ab: ["0", "1"], ba: ["1", "1"] },
  { id: "R9", a: "JournalEntry", b: "JournalLine", rule: "Every journal entry has at least two lines. Each line belongs to exactly one entry.", ab: ["1", "many"], ba: ["1", "1"], two: true },
  { id: "R10", a: "SalesOrder", b: "Invoice", rule: "Each order ships once and is invoiced the day it ships; an order not yet shipped has no invoice. Each invoice is for exactly one sales order.", ab: ["0", "1"], ba: ["1", "1"] },
  { id: "M1", a: "CashReceipt", b: "Invoice", rule: "One check can pay several invoices, and an invoice can be paid in two payments. Every receipt pays at least one invoice; an invoice may not be paid yet.", ab: ["1", "many"], ba: ["0", "many"], mm: true },
  { id: "M2", a: "SalesOrder", b: "Item", rule: "Every order lists at least one item and can list many. An item appears on many orders, and a new item may not have been ordered yet.", ab: ["1", "many"], ba: ["0", "many"], mm: true },
  { id: "M3", a: "PurchaseOrder", b: "Item", rule: "Every PO lists at least one item and can list many. An item appears on many POs, and a new item may not have been ordered yet.", ab: ["1", "many"], ba: ["0", "many"], mm: true }];
const MINOPT = [["0", "0 (optional)"], ["1", "1 (mandatory)"]];
const MAXOPT = [["1", "One"], ["many", "Many"]];

// ---------- Part 4: does the relationship need a linking table? ----------
const LINK = [
  { id: "L1", a: "CashReceipt", b: "Invoice", rule: "One check can pay several invoices, and an invoice can be paid in two payments.", need: "yes",
    keys: [["rcpt_inv", "ReceiptID + InvoiceID (Trailhead's ReceiptApplication)"], ["rcpt", "ReceiptID"], ["inv", "InvoiceID"], ["none", "No linking table needed"]],
    work: "Trailhead's ReceiptApplication table is keyed on ReceiptID + InvoiceID and records how much of each check went to each invoice.",
    single: { rcpt: "A receipt can apply to several invoices, so ReceiptID alone repeats; the key needs both IDs.",
      inv: "An invoice can take two receipts, so InvoiceID alone repeats; the key needs both IDs." } },
  { id: "L2", a: "SalesOrder", b: "Item", rule: "An order lists many items, an item appears on many orders, and Trailhead numbers the lines within each order.", need: "yes",
    keys: [["so_line", "SalesOrderID + LineNumber (SalesOrderLine)"], ["so_sku", "SalesOrderID + SKU"], ["sku", "SKU"], ["none", "No linking table needed"]],
    work: "Trailhead's SalesOrderLine table is keyed on SalesOrderID + LineNumber.", idsku: "so_sku", single: { sku: "An item appears on many orders, so SKU alone repeats. Trailhead's key is the document ID + LineNumber." } },
  { id: "L3", a: "PurchaseOrder", b: "Item", rule: "A PO lists many items, an item appears on many POs, and lines are numbered within each PO.", need: "yes",
    keys: [["po_line", "PurchaseOrderID + LineNumber (PurchaseOrderLine)"], ["po_sku", "PurchaseOrderID + SKU"], ["po", "PurchaseOrderID"], ["none", "No linking table needed"]],
    work: "Trailhead's PurchaseOrderLine table is keyed on PurchaseOrderID + LineNumber.", idsku: "po_sku", single: { po: "A PO has several lines, so PurchaseOrderID alone repeats. Trailhead's key is the document ID + LineNumber." } },
  { id: "L6", a: "ItemReceipt", b: "Item", rule: "A receipt can include several items, an item arrives on many receipts, and lines are numbered within each receipt.", need: "yes",
    keys: [["ir_line", "ItemReceiptID + LineNumber (ItemReceiptLine)"], ["ir_sku", "ItemReceiptID + SKU"], ["ir", "ItemReceiptID"], ["none", "No linking table needed"]],
    work: "Trailhead's ItemReceiptLine table is keyed on ItemReceiptID + LineNumber.", idsku: "ir_sku", single: { ir: "A receipt can have several lines, so ItemReceiptID alone repeats. Trailhead's key is the document ID + LineNumber." } },
  { id: "L7", a: "VendorBill", b: "Item", rule: "A bill can charge for several items, an item is billed on many bills, and lines are numbered within each bill.", need: "yes",
    keys: [["bill_line", "BillID + LineNumber (VendorBillLine)"], ["bill_sku", "BillID + SKU"], ["bill", "BillID"], ["none", "No linking table needed"]],
    work: "Trailhead's VendorBillLine table is keyed on BillID + LineNumber.", idsku: "bill_sku", single: { bill: "A bill can have several lines, so BillID alone repeats. Trailhead's key is the document ID + LineNumber." } },
  { id: "L4", a: "Customer", b: "Invoice", rule: "Each invoice is for one customer; a customer has many invoices.", need: "no",
    keys: [["none", "No linking table needed"], ["cust_inv", "CustomerID + InvoiceID"], ["inv", "InvoiceID"], ["cust", "CustomerID"]] },
  { id: "L5", a: "Vendor", b: "PurchaseOrder", rule: "Each PO goes to one vendor; a vendor gets many POs.", need: "no",
    keys: [["none", "No linking table needed"], ["vend_po", "VendorID + PurchaseOrderID"], ["po", "PurchaseOrderID"], ["vend", "VendorID"]] }];
const NEEDOPT = [["yes", "Yes"], ["no", "No"]];

// The no-giveaway rules: Parts 2-4 never use a relationship whose foreign-key table or linking table is the Part 1
// table, and Part 4 never repeats a Part 2 relationship.
const NOT_WITH_P1 = { SalesOrderLine: ["R2", "R3", "M2", "L2"], PurchaseOrderLine: ["M3", "L3"], Invoice: ["R10", "L4"], CashReceipt: ["R5"], Item: ["R6"], VendorBill: [] };
const SAME = { M1: "L1", M2: "L2", M3: "L3", R7: "L5" };

// ---------- Part 5: check the imported rows ----------
const STATUS = [["ok", "OK"], ["orphan", "Breaks referential integrity (no matching parent)"], ["dup", "Duplicates a primary key"], ["nopk", "Missing primary key"]];
const PAIRS = [
  { parent: "Customer", child: "SalesOrder", cols: ["SalesOrderID", "CustomerID", "OrderDate"], key: "SalesOrderID", fk: "CustomerID", blank: "SalesOrderID" },
  { parent: "Item", child: "SalesOrderLine", cols: ["SalesOrderID", "LineNumber", "SKU", "Quantity"], key: "SalesOrderID + LineNumber", fk: "SKU", blank: "LineNumber" },
  { parent: "Customer", child: "Invoice", cols: ["InvoiceID", "CustomerID", "InvoiceDate", "Amount"], key: "InvoiceID", fk: "CustomerID", blank: "InvoiceID" }];
const BADSKU = ["TNT-3P", "SLB-30", "PCK-45", "BT-HKR", "STV-2B", "JKT-DN"];

// ---------- Problem generator ----------
function gen(seed) {
  const r = mulberry32(seed);
  const R = (a, b) => a + Math.floor(r() * (b - a + 1));
  const one = xs => xs[Math.floor(r() * xs.length)];
  const shuffle = xs => { const a = xs.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const distinct = (n, f) => { const out = []; while (out.length < n) { const x = f(); if (out.indexOf(x) < 0) out.push(x); } return out; };
  const byVendor = v => ITEMS.filter(x => x[2] === v);
  // A whole-dollar amount from real prices: quantity (2-60) × price for one to three items, within [lo, hi].
  const amount = (pool, k, lo, hi) => { for (;;) { const n = R(1, 3), its = distinct(Math.min(n, pool.length), () => one(pool)); const t = its.reduce((s, x) => s + R(2, 60) * x[k], 0); if (t >= lo && t <= hi) return t; } };
  for (let tries = 0; tries < 50000; tries++) {
    // Part 1: one table, its five columns and four sample rows.
    const t1 = Math.floor(r() * KEYTABS.length), K = KEYTABS[t1];
    let rows;
    if (K.table === "SalesOrderLine" || K.table === "PurchaseOrderLine") {
      // An order ID repeats across rows, line numbers repeat across orders, and every (order, line) pair is unique.
      const pat = one([[[0, 1], [0, 2], [1, 1], [1, 2]], [[0, 1], [0, 2], [0, 3], [1, 1]], [[0, 1], [1, 1], [1, 2], [2, 1]], [[0, 1], [0, 2], [1, 1], [2, 1]]]);
      const so = K.table === "SalesOrderLine";
      let id = so ? R(190000, 199000) : R(59000, 59900);
      const ids = [0, 1, 2].map(() => (id += R(1, 40)));
      const pools = [0, 1, 2].map(() => so ? ITEMS : byVendor(one(VENDORS)));
      const used = [[], [], []];
      rows = pat.map(([o, ln]) => {
        let it; do { it = one(pools[o]); } while (used[o].indexOf(it) >= 0); used[o].push(it);
        return [(so ? "SO-" : "PO-") + ids[o], String(ln), it[0], String(R(2, 60)), money(so ? it[4] : it[3])];
      });
    } else if (K.table === "Invoice") {
      const inv = distinct(4, () => R(290000, 299999)).sort(), so = distinct(4, () => R(190000, 199999)).sort(), ds = distinct(4, () => R(0, DAYS.length - 1)).sort((x, y) => x - y);
      rows = inv.map((x, i) => ["INV-" + x, "SO-" + so[i], one(WHOLESALE), DAYS[ds[i]], money(amount(ITEMS, 4, 1000, 20000))]);
    } else if (K.table === "CashReceipt") {
      const rc = distinct(4, () => R(490000, 499999)).sort(), ds = distinct(4, () => R(0, DAYS.length - 1)).sort((x, y) => x - y);
      rows = rc.map((x, i) => ["RC-" + x, one(WHOLESALE), DAYS[ds[i]], money(amount(ITEMS, 4, 1000, 20000)), "Check"]);
    } else if (K.table === "Item") {
      rows = distinct(4, () => one(ITEMS.filter(x => x[2]))).map(x => [x[0], x[1], x[2], money(x[3]), money(x[4])]);
    } else {
      // Vendor bills: one rent bill with no PO; the others are inventory bills on a PO.
      const bl = distinct(4, () => R(69000, 69999)).sort(), po = distinct(3, () => R(59000, 59999)), rent = R(0, 3), nos = distinct(4, () => R(9999100, 9999999));
      let k = 0;
      rows = bl.map((x, i) => {
        if (i === rent) return ["BL-" + x, "V-209", "", "209-" + nos[i], money(R(90, 140) * 100)];
        const v = one(VENDORS);
        return ["BL-" + x, v, "PO-" + po[k++], v.slice(2) + "-" + nos[i], money(amount(byVendor(v), 3, 1000, 24000))];
      });
    }
    const p1 = { table: K.table, columns: K.cols.slice(), rows };

    // Part 2: three relationships, the first-named entity chosen at random. In 60% of sets one is many-to-many.
    const bar = NOT_WITH_P1[K.table];
    const ok2 = REL.map((x, i) => i).filter(i => bar.indexOf(REL[i].id) < 0);
    const mm = r() < 0.6;
    const m = ok2.filter(i => REL[i].mm), o = ok2.filter(i => !REL[i].mm);
    const pick = mm ? [one(m)].concat(distinct(2, () => one(o))) : distinct(3, () => one(o));
    const rel = shuffle(pick).map(i => ({ i, swap: r() < 0.5 }));
    const firstMin = rel.map(x => (x.swap ? REL[x.i].ba : REL[x.i].ab)[0]);
    if (firstMin.indexOf("1") < 0 || firstMin.indexOf("0") < 0) continue;
    // Part 3: the same relationships; the three choices are shown in a random order.
    const fkOrder = rel.map(() => shuffle(["inB", "inA", "link"]));
    // Part 4: two relationships, at least one many-to-many, none from Part 2 or tied to the Part 1 table.
    const in2 = rel.map(x => SAME[REL[x.i].id]).filter(Boolean);
    const ok4 = LINK.map((x, i) => i).filter(i => bar.indexOf(LINK[i].id) < 0 && in2.indexOf(LINK[i].id) < 0);
    const lk = distinct(2, () => one(ok4));
    if (!lk.some(i => LINK[i].need === "yes")) continue;
    const link = lk.map(i => ({ i, order: shuffle([0, 1, 2, 3]) }));

    // Part 5: five imported rows, 1-2 OK; the rest problems of at least two kinds, at most two of any kind.
    const pr = Math.floor(r() * PAIRS.length), PP = PAIRS[pr];
    const nOk = R(1, 2);
    const mixes = (nOk === 2 ? [[2, 1, 0], [2, 0, 1], [1, 2, 0], [0, 2, 1], [1, 0, 2], [0, 1, 2], [1, 1, 1]] : [[2, 2, 0], [2, 0, 2], [0, 2, 2], [2, 1, 1], [1, 2, 1], [1, 1, 2]]);
    const mix = one(mixes), kinds = [];
    for (let k = 0; k < nOk; k++) kinds.push("ok");
    ["orphan", "dup", "nopk"].forEach((x, k) => { for (let j = 0; j < mix[k]; j++) kinds.push(x); });
    const order = shuffle(kinds);
    // A duplicate repeats the key of an OK row entered before it.
    if (order.some((x, k) => x === "dup" && order.slice(0, k).indexOf("ok") < 0)) continue;
    const imp = [];
    const goodParent = () => PP.parent === "Item" ? one(ITEMS)[0] : one(PP.child === "SalesOrder" ? CUSTOMERS.map(c => c[0]) : WHOLESALE);
    const badParent = () => PP.parent === "Item" ? one(BADSKU) : "C-12" + R(0, 9);
    if (PP.child === "SalesOrderLine") {
      let id = R(190000, 199000);
      const sos = [id += R(1, 40), id += R(1, 40)], next = [1, 1];
      order.forEach((x, k) => {
        let so, ln;
        if (x === "dup") { const src = one(imp.filter(y => y.status === "ok")); so = src.vals[0]; ln = src.vals[1]; }
        else { const w = R(0, 1); so = "SO-" + sos[w]; ln = x === "nopk" ? "" : String(next[w]++); }
        imp.push({ status: x, vals: [so, ln, x === "orphan" ? badParent() : goodParent(), String(R(2, 60))] });
      });
    } else {

// Every field is a choice: right, or "Not “label.”" with the reason. A blank or unknown choice reads as unchosen.
function grade(p, vals) {
  const res = {}; let all = true;
  p.fields.forEach(f => {
    const raw = vals[f.id], v = typeof raw === "string" ? raw : "";
    if (!v || !f.opts.some(o => o[0] === v)) res[f.id] = { ok: false, msg: "Choose an answer." };
    else res[f.id] = v === f.ans ? { ok: true, msg: f.okMsg ? "Correct. " + f.okMsg : "Correct." } : { ok: false, msg: f.wrong(v, vals) };
    if (!res[f.id].ok) all = false;
  });
  return { res, all };
}
