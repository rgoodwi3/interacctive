let YEAR = new Date().getFullYear();
/* ==== LAB BEGIN: copied verbatim into fa-lab-platform/supabase/functions/_shared/labs/ais-internal-control.ts ==== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SCENARIO = "These are practice scenarios written for this lab. They are not part of Trailhead's 2026 records or the evidence for Labs C1 and C2 or Project M3, and they don't describe how Trailhead's NetSuite account or company is actually set up.";

// ---------- Part 1: COSO components and principles ----------
const COMP = [["ce", "Control environment"], ["ra", "Risk assessment"], ["ca", "Control activities"], ["ic", "Information and communication"], ["mo", "Monitoring activities"]];
const PRIN = [["p1", "1 Commitment to integrity and ethical values"], ["p2", "2 Board oversight"], ["p3", "3 Structure, authority and responsibility"],
  ["p4", "4 Commitment to competence"], ["p5", "5 Accountability"], ["p6", "6 Suitable objectives"], ["p7", "7 Identifies and analyzes risk"],
  ["p8", "8 Assesses fraud risk"], ["p9", "9 Identifies and analyzes significant change"], ["p10", "10 Selects and develops control activities"],
  ["p11", "11 General controls over technology"], ["p12", "12 Deploys through policies and procedures"], ["p13", "13 Uses relevant, quality information"],
  ["p14", "14 Communicates internally"], ["p15", "15 Communicates externally"], ["p16", "16 Ongoing and separate evaluations"],
  ["p17", "17 Evaluates and communicates deficiencies"]];
// The component each principle belongs to: 1-5, 6-9, 10-12, 13-15, 16-17.
const pcomp = n => n <= 5 ? "ce" : n <= 9 ? "ra" : n <= 12 ? "ca" : n <= 15 ? "ic" : "mo";
const RANGE = { ce: "1–5", ra: "6–9", ca: "10–12", ic: "13–15", mo: "16–17" };
const compName = c => COMP.find(x => x[0] === c)[1].toLowerCase();

// Principles that are easy to mix up, and the sentence that separates them.
const PAIR = {

const COSO = [

// ---------- Part 2: the fraud triangle (statements about roles at a company like Trailhead) ----------
const ELEM = [["pressure", "Pressure"], ["opportunity", "Opportunity"], ["rational", "Rationalization"], ["none", "Not a red flag"]];
const FRAUD = [

// ---------- Part 3: classify the controls (Romney and Steinbart's classifications) ----------
const IPO = [["input", "Input"], ["processing", "Processing"], ["output", "Output"]];
const PD = [["prev", "Preventive"], ["det", "Detective"]];
const AM = [["auto", "Automated"], ["manual", "Manual"]];

const PDWHY = { input: "Preventive stops the error before it's recorded; detective finds it afterward.", processing: "Preventive stops the error before it's recorded; detective finds it afterward.",
  output: "Preventive stops a problem before it happens; detective finds it afterward." };
const AMWHY = { manual: "A person performs it, so it's manual.", auto: "The system performs it with no one acting, so it's automated." };

// ---------- Part 5: the control that answers each risk (Trailhead's policies) ----------
const CTLOPT = [["approvedSO", "Ship only against an approved sales order (P3)"], ["sameDayInv", "Invoice each shipment the same day (P3)"],
  ["poApproval", "Purchase orders approved by purchasing; CEO over $25,000 (P5)"], ["match", "Three-way match within 2% or $50 (P7)"],

const RISK = [

  { ans: "sameDayInv", text: "A shipment goes out but the customer is never billed.", work: "Billing every fulfillment the same day leaves no shipped order unbilled." },

  { ans: "jeApproval", text: "An accountant records an accrual for the wrong amount and no one checks it.", work: "A second person reviews the entry and its support before it posts." },

  { ans: "poApproval", text: "An employee orders goods for personal use on Trailhead's account.", work: "An approver reviews what is being bought and why." },
  { ans: "bankRec", text: "Cash is taken after it's recorded in the books.", work: "A monthly reconciliation by someone who doesn't handle cash shows the shortfall." },
  { ans: "lock", text: "Last month's revenue is changed after the statements are issued.", work: "Locking closed periods stops later changes to reported results." },
  { ans: "ceoPay", text: "A large payment to a new supplier goes out without senior review.", work: "The CEO approves any payment over $10,000." },

// ---------- Problem generator ----------
// Each part draws its catalog items with the spec's rules; the order drawn is the order shown. No numbers change.
function gen(seed) {
  const r = mulberry32(seed);
  let tries = 0;
  const draw = (n, k, ok) => {
    for (;;) {
      if (++tries > 50000) throw new Error("Could not generate a problem set");
      const xs = []; while (xs.length < k) { const i = Math.floor(r() * n); if (xs.indexOf(i) < 0) xs.push(i); }
      if (ok(xs)) return xs;
    }
  };
  const count = (xs, cat, key, v) => xs.filter(i => cat[i][key] === v).length;
  // Part 1: four situations, four principles, at least three components.
  const coso = draw(COSO.length, 4, xs => new Set(xs.map(i => COSO[i].comp)).size >= 3);
  // Part 2: six statements, one or two of each answer. The count-accuracy bonus (Part 1) and the shrinkage bonus
  // (Part 2) never appear together: one is accountability, the other pressure.
  const fraud = draw(FRAUD.length, 6, xs => ELEM.every(o => { const c = count(xs, FRAUD, "ans", o[0]); return c >= 1 && c <= 2; }) &&
    !(coso.indexOf(4) >= 0 && xs.indexOf(0) >= 0));
  // Part 3: three controls covering two or more of input, processing and output, both preventive and detective, both automated and manual.
  const classify = draw(CTRL.length, 3, xs => new Set(xs.map(i => CTRL[i].ipo)).size >= 2 &&
    new Set(xs.map(i => CTRL[i].pd)).size === 2 && new Set(xs.map(i => CTRL[i].am)).size === 2);
  // Part 4: five proposed duties, five different people, at least one with no conflict and two different conflict types.
  const sod = draw(SOD.length, 5, xs => new Set(xs.map(i => SOD[i].who)).size === 5 && count(xs, SOD, "ans", "none") >= 1 &&
    new Set(xs.map(i => SOD[i].ans).filter(a => a !== "none")).size >= 2);
  // Part 5: four risks with four different answers.
  const risk = draw(RISK.length, 4, xs => new Set(xs.map(i => RISK[i].ans)).size === 4);
  return { coso, fraud, classify, sod, risk };
}

// ---------- Parts ----------
const optLabel = (opts, v) => { const o = opts.find(x => x[0] === v); return o ? o[1] : String(v); };
const not = (opts, v) => "Not “" + optLabel(opts, v) + ".” ";
function sel(id, label, opts, ans, work, wrong, row, col) { return { id, label, kind: "sel", opts, ans, work, wrong, row, col }; }
function buildParts(P) {
  const parts = [];

  // Part 1: COSO component and principle.
  const cs = P.coso.map(i => COSO[i]);
  parts.push({ id: "coso", phase: "coso", tick: "1", title: "COSO component and principle", layout: "table", numbered: true,
    desc: "From Marcus Oyelaran, Controller: Hartwell & Lowe, our outside CPAs, visit next month. Before they do, I want everyone on the accounting team fluent in how we think about control. " +
      "Sort these situations by COSO component and principle, read some fraud-risk statements, classify a few controls, check a spring coverage plan for duty conflicts, and match each risk to the control that answers it.\n\n" +
      SCENARIO + "\n\nCOSO's Internal Control framework has five components and 17 principles. For each situation, choose the component and the principle it shows.",
    itemLabel: "Situation", cols: [{ key: "comp", label: "COSO component" }, { key: "prin", label: "Principle" }],
    items: cs.map(c => ({ text: c.text })),
    fields: cs.flatMap((c, i) => {
      const p = "p" + c.prin, ofIt = "Principle " + c.prin + " belongs to " + compName(c.comp) + " (principles " + RANGE[c.comp] + ").";
      return [
        sel("comp" + i, "Situation " + (i + 1) + ": COSO component", COMP, c.comp, ofIt, (v, vals) =>
          not(COMP, v) + (vals && vals["prin" + i] === p ? "You chose the right principle, and principle " + c.prin + " belongs to " + compName(c.comp) + "." : COMPWHY[c.comp]), i, "comp"),
        sel("prin" + i, "Situation " + (i + 1) + ": principle", PRIN, p, c.work, v => {
          const n = Number(v.slice(1)), pair = PAIR[Math.min(n, c.prin) + "-" + Math.max(n, c.prin)];
          return not(PRIN, v) + (pair ? pair + " " : pcomp(n) !== c.comp ? "Principle " + n + " belongs to " + compName(pcomp(n)) + ". " : "") + c.work;
        }, i, "prin")];
    }),
    hint: "Find the principle first; each principle belongs to one component (1–5, 6–9, 10–12, 13–15, 16–17).",
    why: "Auditors evaluate internal control against COSO, so findings are written in its components and principles.",
    walk: cs.map((c, i) => ({ keys: ["comp" + i, "prin" + i], text: "Situation " + (i + 1) + ": " + c.work,
      formula: optLabel(COMP, c.comp) + " · principle " + optLabel(PRIN, "p" + c.prin) })) });

  // Part 2: fraud triangle and red flags.
  const fs = P.fraud.map(i => FRAUD[i]);
  parts.push({ id: "fraud", phase: "coso", tick: "2", title: "Fraud triangle and red flags", layout: "table", numbered: true,
    desc: "These statements came out of a fraud-risk brainstorming session. Each is written about a role at a company like Trailhead, not about anyone here. " +
      "The fraud triangle says fraud needs three things: pressure, opportunity and rationalization. A red flag is a warning sign that one of them is present. " +
      "For each statement, choose the side of the triangle it shows, or say it isn't a red flag.",
    itemLabel: "Statement", cols: [{ key: "el", label: "Fraud triangle" }],
    items: fs.map(f => ({ text: f.text })),
    fields: fs.map((f, i) => sel("el" + i, "Statement " + (i + 1) + ": fraud triangle", ELEM, f.ans, f.work, v => {
      const po = x => x === "pressure" || x === "opportunity";
      if (po(f.ans) && po(v)) return not(ELEM, v) + "Pressure is a motive inside the person; opportunity is a gap in the controls. " + f.work;
      if (f.ans === "pressure" && v === "rational") return not(ELEM, v) + (f.money ? "A money problem is pressure" : "A money motive is pressure") + "; rationalization is the story someone tells to make it seem acceptable. " + f.work;
      if (f.ans === "rational" && v !== "none") return not(ELEM, v) + "These are the words someone uses to excuse it: rationalization is the story someone tells to make it seem acceptable. " + f.work;
      if (f.ans === "opportunity" && v === "rational") return not(ELEM, v) + "Opportunity is a gap in the controls that lets someone act and hide it. " + f.work;
      return not(ELEM, v) + f.work;
    }, i, "el")),
    hint: "Pressure = why they'd want to; opportunity = how they could; rationalization = how they'd excuse it.",
    why: "Controls can remove opportunity, but pressure and rationalization are why managers watch for warning signs too.",
    walk: fs.map((f, i) => ({ keys: ["el" + i], text: "Statement " + (i + 1) + ": " + f.work, formula: optLabel(ELEM, f.ans) })) });

  // Part 3: classify the controls.
  const ks = P.classify.map(i => CTRL[i]);
  parts.push({ id: "classify", phase: "controls", tick: "3", title: "Classify the controls", layout: "table", numbered: true,
    desc: "Classify each control three ways. Where does it act: on data going in (input), on what the system does with it (processing), or on the reports and results that come out (output)? " +
      "Does it stop a problem before it's recorded (preventive) or find it afterward (detective)? Does the system perform it (automated) or a person (manual)?",
    itemLabel: "Control", cols: [{ key: "ipo", label: "Input, processing or output" }, { key: "pd", label: "Preventive or detective" }, { key: "am", label: "Automated or manual" }],
    items: ks.map(k => ({ text: k.text })),
    fields: ks.flatMap((k, i) => [
      Object.assign(sel("ipo" + i, "Control " + (i + 1) + ": input, processing or output", IPO, k.ipo, k.work, v =>
        not(IPO, v) + IPOWHY[[v, k.ipo].sort().join("-")] + " " + k.work, i, "ipo"), k.alt ? { alt: k.alt, altMsg: k.altMsg } : {}),
      sel("pd" + i, "Control " + (i + 1) + ": preventive or detective", PD, k.pd,
        k.pd === "prev" ? "Preventive: it stops the problem before it happens." : "Detective: it finds the problem after it happens.", v =>
        not(PD, v) + PDWHY[k.ipo] + " " + k.work, i, "pd"),
      sel("am" + i, "Control " + (i + 1) + ": automated or manual", AM, k.am, AMWHY[k.am], v => not(AM, v) + AMWHY[k.am], i, "am")]),
    hint: "Ask three questions: where in the flow (in, through, out), before or after the error, and who performs it.",
    why: "Auditors test automated and manual controls differently, and a mix of preventive and detective controls covers more risk.",
    walk: ks.map((k, i) => ({ keys: ["ipo" + i, "pd" + i, "am" + i], text: "Control " + (i + 1) + ": " + k.work + " " + AMWHY[k.am],
      formula: optLabel(IPO, k.ipo) + " · " + optLabel(PD, k.pd) + " · " + optLabel(AM, k.am) })) });

  // Part 4: duty conflicts in the coverage plan.
  const ss = P.sod.map(i => SOD[i]);
  parts.push({ id: "sod", phase: "controls", tick: "4", title: "Duty conflicts in the coverage plan", layout: "table", numbered: true,
    desc: "Several people are out at different times this spring. Marcus proposes these temporary added duties. For each, say which incompatible functions it would combine, if any.\n\n" +
      "Authorization is approving transactions. Recording is keeping the accounting records: vendor bills, invoices, customer payments, journal entries and inventory adjustments. " +
      "Custody is handling goods or cash, including receiving and shipping goods and the warehouse records of that movement (item receipts and fulfillments).",
    itemLabel: "Proposed added duty", cols: [{ key: "sod", label: "Incompatible functions" }],
    items: ss.map(s => ({ text: s.who + " (" + s.role + ") " + s.duty + ". Added duty: " + s.add + "." })),
    fields: ss.map((s, i) => sel("sod" + i, "Duty " + (i + 1) + ": incompatible functions", SODOPT, s.ans, s.work, v =>
      not(SODOPT, v) + (s.ans !== "none" && v !== "none" ? SODWHY + " " : "") + s.work, i, "sod")),
    hint: "Name the function of each duty first: approve, keep the accounting records, or handle the goods or cash. Two different functions in one person is a conflict.",
    why: "Splitting authorization, recording and custody means one person can't both commit and hide an error or theft.",
    walk: ss.map((s, i) => ({ keys: ["sod" + i], text: "Duty " + (i + 1) + ": " + s.work, formula: optLabel(SODOPT, s.ans) })) });

  // Part 5: the control that answers each risk.
  const rs = P.risk.map(i => RISK[i]);
  parts.push({ id: "riskcontrol", phase: "controls", tick: "5", title: "The control that answers each risk", layout: "table", numbered: true,
    desc: "Each risk below could happen somewhere in Trailhead's cycles. Choose the control from Trailhead's policies that would best stop it or catch it. The policies are in the data panel.",
    itemLabel: "Risk", cols: [{ key: "ctl", label: "Control that answers it" }],
    items: rs.map(x => ({ text: x.text })),
    fields: rs.map((x, i) => sel("ctl" + i, "Risk " + (i + 1) + ": control", CTLOPT, x.ans, x.work, v => not(CTLOPT, v) + x.work, i, "ctl")),
    hint: "Ask what could go wrong at that point in the cycle, then which control would stop or catch it.",
    why: "COSO principle 10: each control is chosen to answer a specific risk.",
    walk: rs.map((x, i) => ({ keys: ["ctl" + i], text: "Risk " + (i + 1) + ": " + x.work, formula: optLabel(CTLOPT, x.ans) })) });
  return parts;
}

// ---------- Grading ----------
// Every field is a choice: right, or "Not “label.”" with the reason. A blank or unknown choice reads as unchosen.
function grade(p, vals) {
  const res = {}; let all = true;
  p.fields.forEach(f => {
    const raw = vals[f.id], v = typeof raw === "string" ? raw : "";
    if (!v || !f.opts.some(o => o[0] === v)) res[f.id] = { ok: false, msg: "Choose an answer." };
    else res[f.id] = v === f.ans ? { ok: true, msg: "Correct." } : (f.alt || []).indexOf(v) >= 0 ? { ok: true, msg: "Correct. " + f.altMsg } : { ok: false, msg: f.wrong(v, vals) };
    if (!res[f.id].ok) all = false;
  });
  return { res, all };
}
/* ==== LAB END ==== */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function bizHTML() { return "<b>Trailhead Outfitters Co.</b> sells camping and hiking gear to outdoor shops and web shoppers and buys it from its vendors, all in NetSuite. You are a staff accountant reporting to Marcus Oyelaran, the controller."; }
// The data panel is the same in both modes and reads nothing from the problem (IL3 has no public info).
function dtab(caption, cols, rows) {
  return '<div class="scroll" style="margin-top:12px"><table class="dtab"><caption><div class="cap-name">' + esc(caption) + '</div></caption><thead><tr>' +
    cols.map(c => '<th scope="col">' + esc(c) + '</th>').join("") + '</tr></thead><tbody>' +
    rows.map(row => '<tr>' + row.map((x, i) => i === 0 ? '<th scope="row">' + esc(x) + '</th>' : '<td>' + esc(x) + '</td>').join("") + '</tr>').join("") + '</tbody></table></div>';
}

const PEOPLE = [
  ["Dana Whitfield", "Owner and CEO", "Approves payments over $10,000, new vendors and the budget", "CEO (approve only)"],
  ["Marcus Oyelaran", "Controller", "Runs the close and prepares the statements", "Controller"],
  ["Priya Raman", "Senior Accountant", "General ledger and month-end accruals; deposits checks daily", "Accountant"],
  ["You", "Staff Accountant", "AR, AP and close tasks", "Accountant"],
  ["Elena Kowalczyk", "AR Specialist", "Invoices customers, applies payments, follows up past-due accounts", "A/R Clerk"],

  ["Jordan Banks", "Sales Representative", "Enters wholesale sales orders", "Sales Rep"],

  ["Sam Okafor", "IT Administrator (contractor)", "NetSuite administration, users, web store", "Administrator"],

const POLICIES = [
  ["P3", "Shipping and billing", "Nothing ships without an approved sales order. Each shipment is invoiced the same day"],

  ["P7", "Three-way match", "A vendor bill is paid only when it agrees with the purchase order and the item receipt within 2% or $50, whichever is less"],

  ["P9", "Journal entries", "Manual journal entries need support attached and approval by someone other than the preparer"],

const COSO_TABLE = [["Control environment", "1–5"], ["Risk assessment", "6–9"], ["Control activities", "10–12"], ["Information and communication", "13–15"], ["Monitoring activities", "16–17"]];
const NOTE = '<p class="note">These situations are practice scenarios written for this lab. They are not Trailhead\'s records, and they don\'t describe how its NetSuite account is set up.</p>';
const peopleBlock = () => dtab("People and NetSuite roles", ["Person", "Title", "Does", "NetSuite role"], PEOPLE);
const policyBlock = () => '<ul class="pol" aria-label="Trailhead policies">' + POLICIES.map(p => '<li><b>' + esc(p[0]) + ' · ' + esc(p[1]) + '.</b> ' + esc(p[2]) + '.</li>').join("") + '</ul>';
const cosoBlock = () => dtab("COSO Internal Control: components and their principles", ["Component", "Principles"], COSO_TABLE);
function dataHTML(c) {

MAFrame.start({

});
