<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InterACCtive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --navy:#002D74; --navy-dk:#001d4d; --navy-tint:#e8eef8; --gold:#FFC629; --gold-tint:#fff6d9;
  --ink:#1b2333; --muted:#5a6475; --line:#d6dce6; --bg:#f3f5f9; --card:#ffffff;
  --good:#1d7a46; --good-bg:#e6f4ec; --bad:#b3261e; --bad-bg:#fdecea;
  --head:"Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
a{color:var(--navy)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.masthead{background:var(--navy);color:#fff;border-bottom:5px solid var(--gold)}
.masthead .wrap{padding:18px 16px 20px}
.kicker{font:600 13px/1.2 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.masthead h1{font:700 30px/1.15 var(--head);margin:6px 0 4px}
.masthead .sub{color:#d6e0f2;font-size:15px}
.toolbar{background:#fff;border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-top:10px;padding-bottom:10px;font-size:15px;color:var(--muted)}
.toolbar b{color:var(--navy)}
.toolbar .btn{margin-left:auto}
main{padding:18px 0 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;margin:0 0 18px}
.card h2{font:700 22px/1.2 var(--head);color:var(--navy);margin:0 0 6px}
.card h3{font:700 18px/1.25 var(--head);color:var(--navy);margin:16px 0 6px}
.lead{color:var(--muted);margin:0 0 14px;max-width:720px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px;line-height:1.2;text-decoration:none}
.btn:hover{background:var(--navy-tint)}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-dk)}
.btn.gold{background:var(--gold);border-color:#e0a800;color:var(--navy-dk)}.btn.gold:hover{background:#ffd457}
.btn.sm{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.form{display:grid;gap:12px;max-width:420px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:grid;gap:4px;font-weight:600;font-size:15px}
input,select{padding:7px 9px;border:1px solid #aab4c4;border-radius:6px;background:#fff;font-weight:400}
input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:7px;overflow:hidden;margin-bottom:16px}
.seg button{border:0;background:#fff;color:var(--navy);padding:8px 16px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;font:600 16px/1.2 var(--head);color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold)}
.msg{border-radius:6px;padding:8px 12px;margin:10px 0 0;font-size:15px}
.msg.good{background:var(--good-bg);color:#14532f}.msg.bad{background:var(--bad-bg);color:#7a1a14}.msg.info{background:var(--navy-tint);color:var(--navy-dk)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th{font:600 13px/1.2 var(--head);text-transform:uppercase;letter-spacing:.04em;color:var(--navy);text-align:left;padding:8px;border-bottom:2px solid var(--navy);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
td input[type=number]{width:72px}td input.ch{width:92px}
.muted{color:var(--muted)}.small{font-size:14px}
.code{font:600 30px/1 var(--mono);letter-spacing:.12em;color:var(--navy);background:var(--gold-tint);border:1px dashed #c9a400;border-radius:8px;padding:10px 16px;display:inline-block}
.coursehead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;background:var(--navy-tint);color:var(--navy)}
.tag.graded{background:var(--gold-tint);color:#6b5a00}
.empty{color:var(--muted);font-style:italic}
footer{color:var(--muted);font-size:13px;text-align:center;padding:0 16px 30px}
@media (max-width:600px){.masthead h1{font-size:25px}.card{padding:16px 14px}}
.linkbtn{border:0;background:none;color:var(--navy);text-decoration:underline;cursor:pointer;padding:0;font-size:15px}
.authlinks{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px}
label.check{display:flex;gap:8px;align-items:center;font-weight:400}
summary{cursor:pointer;font:700 18px/1.25 var(--head);color:var(--navy)}
details .lead{margin-top:10px}
.tag.auto{background:var(--bad-bg);color:#7a1a14}
.tag.flag{background:#7a1a14;color:#fff}
.brandgrid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(260px,1.2fr);gap:18px;align-items:start;margin-top:10px}
@media (max-width:720px){.brandgrid{grid-template-columns:1fr}}
.brandgrid .colors{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.brandgrid input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--rule,#d8dfea);border-radius:6px;vertical-align:middle;background:#fff}
.brandgrid .hex{width:92px;font-family:var(--mono,monospace)}
.bprev{border:1px solid #d8dfea;border-radius:8px;overflow:hidden;background:#fff}
.bprev .bm{padding:12px 14px 10px;color:#fff}.bprev .be{font:700 11.5px/1.2 var(--head);letter-spacing:.12em;text-transform:uppercase}
.bprev .bt{font:700 19px/1.2 var(--head);margin-top:3px}.bprev .br{height:4px}
.bprev .bb{padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bprev .bbtn{border-radius:6px;padding:5px 12px;font-weight:700;font-size:14px;color:#111b2e}
.bchecks{list-style:none;padding:0;margin:10px 0 0;font-size:14px}.bchecks li{margin:3px 0}.bchecks .ok{color:#14532f}.bchecks .no{color:#7a1a14}
fieldset.subjects{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center}fieldset.subjects legend{font-weight:600;font-size:14px;padding:0;margin-bottom:4px;width:100%}
.flags td{vertical-align:top}.flags ul{margin:0;padding-left:18px}
.cprev{border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:8px;background:#fff;max-height:560px;overflow:auto}
.cpaste{width:100%;margin-top:8px;font:13px/1.4 var(--mono);padding:8px;border:1px solid #aab4c4;border-radius:6px}
details.copied summary{font:600 15px/1.3 var(--body);margin-top:8px}
.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.danger:hover{background:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);color:#fff}.btn.danger.solid:hover{background:#8f1e18}
#cmsg:empty{display:none}#cmsg{margin:-4px 0 12px}
dialog.dlg{border:0;border-radius:10px;padding:0;width:min(560px,calc(100% - 32px));box-shadow:0 18px 50px rgba(0,20,60,.3);color:var(--ink)}
dialog.dlg::backdrop{background:rgba(10,20,40,.5)}
.dlg .dh{background:var(--bad);color:#fff;padding:14px 20px}.dlg .dh h2{font:700 22px/1.2 var(--head);margin:0;color:#fff}
.dlg .db{padding:16px 20px 18px}.dlg .db p{margin:0 0 12px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="platform.js"></script>
</head>
<body>
<header class="masthead"><div class="wrap">
  <div class="kicker">Financial Accounting Labs and Games</div>
  <h1>InterACCtive</h1>
  <div class="sub">Your classes, assigned labs and games, and your results</div>
</div></header>
<div class="toolbar" id="toolbar" hidden><div class="wrap">
  <span>Signed in as <b id="who"></b> · <span id="role"></span></span>
  <a id="adminlink" href="#admin" hidden></a>
  <button class="btn sm" id="signout" type="button">Sign out</button>
</div></div>
<div class="wrap"><main id="app"><div class="card"><p class="muted">Loading…</p></div></main></div>
<footer>Games save to your class only when you open them from this page.</footer>

<script>
(() => {
  const cfg = window.PLATFORM_CONFIG;
  const sb = window.supabase.createClient(cfg.url, cfg.key);
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const msg = (kind, text) => `<div class="msg ${kind}" role="status">${text}</div>`;
  const fmtDate = d => d ? new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const toLocalInput = d => { if (!d) return ''; const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 16); };
  const pct = (s, t) => t ? Math.round(1000 * s / t) / 10 : 0;   // one decimal, so a percent can be turned back into points
  // Which subjects a class includes (courses.subjects) and the labels instructors see.
  const SUBJECTS = [['financial', 'Financial accounting'], ['managerial', 'Managerial accounting'], ['ais', 'Accounting information systems'], ['games', 'Accounting games']];
  const SUBJECT_SHORT = { financial: 'financial', managerial: 'managerial', ais: 'AIS', games: 'games' };
  const subjectsText = list => { const n = (list || ['financial']).map(v => SUBJECT_SHORT[v] || v);
    return n.length < 3 ? n.join(' and ') : n.slice(0, -1).join(', ') + ' and ' + n.at(-1); };
  const subjectBoxes = (name, checked) => SUBJECTS.map(([v, n]) => `<label class="check"><input type="checkbox" name="${name}" value="${v}"${checked.includes(v) ? ' checked' : ''}> ${n}</label>`).join('');
  const CH_OK = /^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$/;
  const MIN_PASSWORD = 8;
  let me = null, catalog = [], state = { course: null, tab: 'assign' };

  // The API returns at most 1000 rows per request, so a large class needs several.
  async function fetchAll(query) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await query().range(from, from + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) return out;
    }
  }

  // ---------- data ----------
  async function loadMe() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const { data } = await sb.from('profiles').select('id,full_name,email,role,is_admin,brand_institution,brand_primary,brand_accent').eq('id', session.user.id).maybeSingle();
    return data;
  }
  async function loadCatalog() {
    const { data } = await sb.from('activities').select('id,slug,title,url,scored,server_graded,chapter,description,sort_order,subject,points_possible').order('sort_order');
    catalog = data || [];
  }
  // Labs take ?course=&lab=. Games take ?course=&act=&ch=. Game urls are relative to this page.
  function activityLink(a, courseId, chapters) {
    const u = new URL(a.url, location.href);
    u.searchParams.set('course', courseId);
    if (a.server_graded) u.searchParams.set('lab', a.slug);
    else { u.searchParams.set('act', a.slug); u.searchParams.set('ch', chapters); }
    return u.href;
  }

  // ---------- sign in, sign up, forgot password ----------
  // Email steps use the one-time code typed on this page. Links in emails are never used,
  // because university mail scanners open them and use them up.
  const CODE_FIELD = `<label>Code from the email<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required></label>`;
  const readCode = f => String(f.get('code') || '').replace(/\s/g, '');

  function authView(mode = 'in', note = '', email = '') {
    document.getElementById('toolbar').hidden = true;
    const showSeg = mode === 'in' || mode === 'up';
    const fields = {
      in: `<label>Email<input name="email" type="email" autocomplete="email" value="${esc(email)}" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>`,
      up: `<label>Full name<input name="name" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" value="${esc(email)}" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="${MIN_PASSWORD}" required></label>`,
      confirm: `<p class="lead">Enter the code we sent to <b>${esc(email)}</b> to confirm your email. It can take a minute to arrive, so check your junk folder too.</p>${CODE_FIELD}`,
      forgot: `<p class="lead">Enter your email and we'll send you a code to reset your password.</p>
        <label>Email<input name="email" type="email" autocomplete="email" value="${esc(email)}" required></label>`,
      recover: `<p class="lead">Enter the code we sent to <b>${esc(email)}</b>. It can take a minute to arrive, so check your junk folder too.</p>${CODE_FIELD}`,
      newpass: `<p class="lead">Choose a new password for <b>${esc(email)}</b>.</p>
        <label>New password<input name="password" type="password" autocomplete="new-password" minlength="${MIN_PASSWORD}" required></label>`
    }[mode];
    const submit = { in: 'Sign in', up: 'Create account', confirm: 'Confirm email', forgot: 'Send code', recover: 'Check code', newpass: 'Save password' }[mode];
    const links = {
      in: '<button class="linkbtn" type="button" data-go="forgot">Forgot your password?</button>',
      confirm: '<button class="linkbtn" type="button" data-resend>Send a new code</button><button class="linkbtn" type="button" data-go="in">Back to sign in</button>',
      forgot: '<button class="linkbtn" type="button" data-go="in">Back to sign in</button>',
      recover: '<button class="linkbtn" type="button" data-resend>Send a new code</button><button class="linkbtn" type="button" data-go="in">Back to sign in</button>'
    }[mode] || '';
    app.innerHTML = `<div class="card">
      ${showSeg ? `<div class="seg" role="group" aria-label="Choose"><button type="button" data-go="in" aria-pressed="${mode === 'in'}">Sign in</button><button type="button" data-go="up" aria-pressed="${mode === 'up'}">Create account</button></div>` : ''}
      <form class="form" id="authf" novalidate>${fields}
        <div><button class="btn primary" type="submit">${submit}</button></div>
      </form><div class="authlinks">${links}</div><div id="authmsg">${note}</div></div>`;
    const out = document.getElementById('authmsg'), form = document.getElementById('authf');
    const say = (kind, text) => { out.innerHTML = msg(kind, esc(text)); };
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
      const typed = form.elements.email ? form.elements.email.value.trim() : email;
      authView(b.dataset.go, '', typed);
    }));
    const resend = app.querySelector('[data-resend]');
    if (resend) resend.addEventListener('click', async () => {
      say('info', 'Sending…');
      const { error } = mode === 'confirm' ? await sb.auth.resend({ type: 'signup', email }) : await sb.auth.resetPasswordForEmail(email);
      if (error) say('bad', error.message); else say('good', 'We sent a new code. Use the newest one.');
    });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(form), typedEmail = String(f.get('email') || '').trim(), password = String(f.get('password') || '');
      if ('email' in form.elements && !typedEmail) { say('bad', 'Enter your email.'); return; }
      if ((mode === 'up' || mode === 'newpass') && password.length < MIN_PASSWORD) { say('bad', `Use a password of at least ${MIN_PASSWORD} characters.`); return; }
      if (mode === 'in' && !password) { say('bad', 'Enter your password.'); return; }
      if ((mode === 'confirm' || mode === 'recover') && !readCode(f)) { say('bad', 'Enter the code from the email.'); return; }
      const name = String(f.get('name') || '').trim();
      if (mode === 'up' && !name) { say('bad', 'Enter your full name.'); return; }
      say('info', 'Working…');
      try { await ({ in: doSignIn, up: doSignUp, confirm: doConfirm, forgot: doForgot, recover: doRecover, newpass: doNewPassword }[mode])(); }
      catch (err) { say('bad', err.message || 'Something went wrong. Try again.'); }

      async function doSignIn() {
        const { error } = await sb.auth.signInWithPassword({ email: typedEmail, password });
        if (error && error.code === 'email_not_confirmed') {
          authView('confirm', msg('info', esc('This email is not confirmed yet. Use the code from your sign-up email, or send a new one.')), typedEmail);
          return;
        }
        if (error) throw error;
        start();
      }
      async function doSignUp() {
        // Everyone starts as a student. The database sets the role, so it is not sent from here.
        const { data, error } = await sb.auth.signUp({ email: typedEmail, password, options: { data: { full_name: name } } });
        if (error) throw error;
        if (data.session) { start(); return; }
        authView('confirm', '', typedEmail);
      }
      async function doConfirm() {
        const { error } = await sb.auth.verifyOtp({ email, token: readCode(f), type: 'signup' });
        if (error) throw new Error("That code didn't work. Check it, or send a new one.");
        start();
      }
      async function doForgot() {
        const { error } = await sb.auth.resetPasswordForEmail(typedEmail);
        if (error) throw error;
        authView('recover', '', typedEmail);
      }
      async function doRecover() {
        const { error } = await sb.auth.verifyOtp({ email, token: readCode(f), type: 'recovery' });
        if (error) throw new Error("That code didn't work. Check it, or send a new one.");
        authView('newpass', '', email);
      }
      async function doNewPassword() {
        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error;
        start();
      }
    });
    const first = form.querySelector('input'); if (first && !showSeg) first.focus();
  }

  // ---------- request instructor access (anyone who is not yet an instructor) ----------
  async function requestCard() {
    const { data: rows, error } = await sb.from('instructor_requests').select('status,note,created_at,reviewed_at').eq('user_id', me.id).order('created_at', { ascending: false }).limit(1);
    if (error) return `<div class="card">${msg('bad', esc(error.message))}</div>`;
    const r = rows && rows[0];
    if (r && r.status === 'pending') {
      return `<div class="card" id="reqcard"><h2>Instructor access</h2>${msg('info', `Your request from ${esc(fmtDate(r.created_at))} is waiting for review.`)}</div>`;
    }
    const rejected = r && r.status === 'rejected'
      ? msg('bad', `Your request was not approved${r.reviewed_at ? ' on ' + esc(fmtDate(r.reviewed_at)) : ''}.${r.note ? ' Note: ' + esc(r.note) : ''} You can send a new request.`) : '';
    return `<div class="card" id="reqcard"><details${rejected ? ' open' : ''}><summary>Are you an instructor? Request instructor access</summary>
      <p class="lead">Instructor accounts are approved by hand. Sign up with your university email address (ending in .edu) and link to your page on your university's website.</p>
      ${rejected}
      <form class="form" id="reqf">
        <label>Full name<input name="name" autocomplete="name" value="${esc(me.full_name || '')}" required></label>
        <label>Link to your university directory page<input name="url" type="url" maxlength="500" placeholder="https://www.yourschool.edu/faculty/your-name" required></label>
        <div><button class="btn primary" type="submit">Request instructor access</button></div>
      </form><div id="reqmsg"></div></details></div>`;
  }
  function wireRequest() {
    const form = document.getElementById('reqf');
    if (!form) return;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(form), out = document.getElementById('reqmsg');
      const name = String(f.get('name') || '').trim(), url = String(f.get('url') || '').trim();
      if (!name || !url) { out.innerHTML = msg('bad', 'Enter your full name and the link.'); return; }
      out.innerHTML = msg('info', 'Sending…');
      const { error } = await sb.rpc('request_instructor_access', { p_full_name: name, p_directory_url: url });
      if (error) { out.innerHTML = msg('bad', esc(error.message)); return; }
      studentView();
    });
  }

  // ---------- student ----------
  async function studentView(note = '') {
    const { data: rows, error } = await sb.from('enrollments').select('course_id, courses(id,name,term)').eq('student_id', me.id);
    if (error) { app.innerHTML = `<div class="card">${msg('bad', esc(error.message))}</div>`; return; }
    const courses = (rows || []).map(r => r.courses).filter(Boolean);
    const ids = courses.map(c => c.id);
    const [asg, att, labRows, reqCard] = await Promise.all([
      ids.length ? fetchAll(() => sb.from('course_activities').select('course_id,activity_id,mode,due_at,max_attempts,chapters').in('course_id', ids).order('activity_id')) : [],
      ids.length ? fetchAll(() => sb.from('attempts').select('id,course_id,activity_id,score,total').eq('student_id', me.id).in('course_id', ids).order('id')) : [],
      Promise.all(ids.map(async id => {
        const { data, error } = await sb.rpc('my_lab_attempts', { p_course: id });
        if (error) throw error;
        return data.map(r => ({ ...r, course_id: id }));
      })).then(r => r.flat()),
      requestCard()
    ]);
    const byId = Object.fromEntries(catalog.map(a => [a.id, a]));
    const now = Date.now();
    const row = (c, x) => {
      const mine = att.filter(t => t.course_id === c.id && t.activity_id === x.activity_id);
      const graded = x.a.scored && x.mode === 'graded';
      // A lab attempt counts as used from the moment it starts, the same way the grading server counts it.

  // ---------- instructor branding ----------
  // The school name and two colors students see in labs and games opened from this instructor's classes
  // (profiles.brand_*; read by brand.js through course_branding). Blank means the default look.
  const BRAND_DEFAULT = { school: 'University of New Haven', primary: '#002d74', accent: '#ffc629' };
  const hexOk = v => /^#[0-9a-f]{6}$/i.test(v || '');
  const lumOf = h => [1, 3, 5].reduce((s, i, k) => { let c = parseInt(h.substr(i, 2), 16) / 255; c = c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); return s + c * [0.2126, 0.7152, 0.0722][k]; }, 0);
  const contrastOf = (a, b) => { const x = lumOf(a), y = lumOf(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const brandChecks = (P, A) => [
    [contrastOf(P, '#ffffff') >= 4.5, 'White text is readable on the main color'],
    [contrastOf(A, P) >= 3, 'The accent stands out from the main color'],
    [contrastOf(A, '#111b2e') >= 4.5, 'Dark text is readable on the accent (it is used behind dark text on buttons)']
  ];

  function wireBranding() {
    const f = document.getElementById('brandf'); if (!f) return;
    const el = n => f.elements[n];
    const current = () => {
      const custom = el('custom').checked;
      return { school: el('school').value.trim(), custom, P: custom ? el('ph').value.trim().toLowerCase() : BRAND_DEFAULT.primary, A: custom ? el('ah').value.trim().toLowerCase() : BRAND_DEFAULT.accent };
    };
    const paint = () => {
      const v = current();
      ['p', 'ph', 'a', 'ah'].forEach(n => { el(n).disabled = !v.custom; });
      const valid = hexOk(v.P) && hexOk(v.A);
      const checks = valid ? brandChecks(v.P, v.A) : [[false, 'Enter colors as six-digit codes, like #c8102e']];
      document.getElementById('bchecks').innerHTML = v.custom ? checks.map(([ok, t]) => `<li class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${esc(t)}</li>`).join('') : '';
      const P = valid ? v.P : BRAND_DEFAULT.primary, A = valid ? v.A : BRAND_DEFAULT.accent;
      const label = contrastOf(A, P) >= 4.5 ? A : '#ffffff';
      document.getElementById('bprev').innerHTML = `<div class="bm" style="background:${P}"><div class="be" style="color:${label}">${esc(v.school || BRAND_DEFAULT.school)} · Financial Accounting · Chapter 8</div><div class="bt">Receivables &amp; Bad Debts Lab</div></div>

      return valid && checks.every(([ok]) => ok);
    };
    el('p').addEventListener('input', () => { el('ph').value = el('p').value; paint(); });
    el('a').addEventListener('input', () => { el('ah').value = el('a').value; paint(); });
    ['ph', 'ah'].forEach(n => el(n).addEventListener('input', () => { const v = el(n).value.trim(); if (hexOk(v)) el(n[0]).value = v.toLowerCase(); paint(); }));
    el('custom').addEventListener('change', paint);
    el('school').addEventListener('input', paint);
    paint();
    const save = async (row, done) => {
      const { error } = await sb.from('profiles').update(row).eq('id', me.id);
      if (error) { document.getElementById('brandmsg').innerHTML = msg('bad', esc(/readable/.test(error.message) ? 'Those colors aren\'t readable together. Adjust them until all three checks pass.' : error.message)); return; }

    f.addEventListener('submit', e => {
      e.preventDefault();

      if (v.school && (v.school.length < 2 || /[<>]/.test(v.school))) { document.getElementById('brandmsg').innerHTML = msg('bad', 'Enter a school name of 2 to 80 characters, without < or >.'); return; }
      if (v.custom && !paint()) { document.getElementById('brandmsg').innerHTML = msg('bad', 'Adjust the colors until all three checks pass.'); return; }

    });
  }

  // Puts the HTML on the clipboard twice over: as code (text/plain), for Canvas's HTML editor, and as
  // formatted text (text/html), for pasting into the editor's normal view.
  async function copyHtml(html) {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'text/plain': new Blob([html], { type: 'text/plain' }), 'text/html': new Blob([html], { type: 'text/html' }) })]);
        return true;
      } catch (e) { /* fall back to plain text */ }
    }
    try { await navigator.clipboard.writeText(html); return true; } catch (e) { return false; }
  }
  // Copies the HTML and says so in `out`, with how to paste it and a preview. If the browser blocks the
  // clipboard, it shows the code, selected, to copy by hand.
  async function showCopy(out, html, what, how) {
    const preview = `<details class="copied"><summary>See what you copied</summary><div class="cprev">${html}</div></details>`;
    if (await copyHtml(html)) out.innerHTML = msg('good', `Copied ${what}. ${how}`) + preview;
    else {
      out.innerHTML = msg('info', `Your browser didn't allow copying. Select all the code below and copy it (Ctrl+C, or ⌘C on a Mac). ${how}`) +
        `<textarea class="cpaste" rows="8" readonly aria-label="HTML to copy">${esc(html)}</textarea>` + preview;
      const ta = out.querySelector('textarea'); ta.focus(); ta.select();
    }
    out.scrollIntoView({ block: 'nearest' });
  }

  // The Canvas page that tells students how to register, confirm their email and join this class.

  function studentInstructions(c) {
    const { P, A, school, kickerColor } = brandLook();

  async function roster(c) {
    const data = await fetchAll(() => sb.from('enrollments').select('student_id,joined_at,profiles(full_name,email)').eq('course_id', c.id).order('student_id'));
    return data.map(r => ({ id: r.student_id, joined: r.joined_at, name: (r.profiles && r.profiles.full_name) || '', email: (r.profiles && r.profiles.email) || '' }))
      .sort((p, q) => p.name.localeCompare(q.name));

  // ---------- gradebook ----------
  // CSV files. A leading = + - or @ would run as a formula in a spreadsheet, and students type their own names.
  const csvText = v => (/^[=+\-@\t\r]/.test(String(v)) ? "'" : '') + String(v);
  const csvName = (c, what) => `${c.name.replace(/[^\w -]/g, '')} ${what}.csv`;
  function downloadCsv(rows, filename) {
    const lines = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
    const url = URL.createObjectURL(new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/csv' }));
    const link = document.createElement('a'); link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Everything the gradebook knows about one class. For each student and activity, cell() gives the best
  // finished score, how many attempts finished, how much of the activity is done, and any open lab attempt.
  async function gradeData(c) {
    const [people, asg, att, labs] = await Promise.all([
      roster(c),
      fetchAll(() => sb.from('course_activities').select('activity_id,mode').eq('course_id', c.id).order('activity_id')),
      fetchAll(() => sb.from('attempts').select('id,student_id,activity_id,score,total').eq('course_id', c.id).order('id')),
      fetchAll(() => sb.from('lab_attempts').select('id,student_id,activity_id,started_at,finished_at,auto_closed,steps,possible,total').eq('course_id', c.id).order('id'))
    ]);
    const acts = catalog.filter(a => a.scored && asg.some(x => x.activity_id === a.id));
    const graded = a => asg.some(x => x.activity_id === a.id && x.mode === 'graded');
    // A lab records work only in Graded mode. A game saves its rounds in either mode.
    const tracked = a => !a.server_graded || graded(a);
    // How much of a lab attempt is done: the points of the steps submitted (right or wrong), out of the attempt's points.
    const labDone = (l, a) => {
      const possible = l.possible || l.total || a.points_possible;
      const done = Object.values(l.steps || {}).reduce((s, v) => s + (Number(v && v.maxPoints) || 0), 0);
      return possible ? Math.min(100, pct(done, possible)) : (l.finished_at ? 100 : 0);
    };
    const cell = (sid, a) => {
      const done = att.filter(t => t.student_id === sid && t.activity_id === a.id);
      const mine = labs.filter(l => l.student_id === sid && l.activity_id === a.id);
      return {
        best: done.length ? Math.max(...done.map(t => pct(t.score, t.total))) : null,
        n: done.length,
        // A lab: its furthest attempt. A game: done once a round is saved.
        complete: a.server_graded ? (mine.length ? Math.max(...mine.map(l => labDone(l, a))) : null) : (done.length ? 100 : null),
        open: mine.find(l => !l.finished_at),
        autoClosed: mine.some(l => l.auto_closed)
      };
    };
    return { people, asg, att, labs, acts, graded, tracked, cell };
  }

  async function gradesPane(c) {
    const pane = document.getElementById('pane');
    const { people, labs, acts, graded, tracked, cell } = await gradeData(c);
    if (!people.length || !acts.length) { pane.innerHTML = `<p class="empty">${!acts.length ? 'Assign a scored activity first.' : 'No students yet.'}</p>`; return; }
    const view = state.gview === 'complete' ? 'complete' : 'score';
    // Labs assigned as Practice never record work, so the completion view leaves them out.
    const cols = view === 'complete' ? acts.filter(tracked) : acts;
    // Activity flags saved by the grading server with each step's first submission (see integrity.js).
    // Strong flags send an attempt to review on their own; fast and paste only when repeated.
    const FLAG_TEXT = {
      script: 'Answers were filled in, or buttons clicked, by a script rather than the keyboard or mouse',
      inserted: 'Text appeared in answer boxes without being typed or pasted, the way AI browser agents enter it',
      automation: 'The browser reported that automation software was controlling it',
      robotic: 'Typing was faster and more even than a person types',
      fast: 'Submitted faster than the step could be read and filled in',
      paste: 'Answers were pasted in',
      away: 'Left the lab page for 30 seconds or more',
      nodata: 'No activity data was sent (an older copy of the page, or the data was blocked)'
    };
    const STRONG = ['script', 'inserted', 'automation', 'robotic'];
    const review = l => {
      const by = {};
      Object.entries(l.steps || {}).forEach(([k, s]) => (s && Array.isArray(s.flags) ? s.flags : []).forEach(f => (by[f] = by[f] || []).push(Number(k) + 1)));
      const strong = STRONG.some(f => by[f]);
      const flagged = strong || (by.fast || []).length >= 3 || (by.paste || []).length >= 2;
      return { by, flagged };
    };
    const flaggedLabs = labs.map(l => ({ l, r: review(l) })).filter(x => x.r.flagged);
    const cellHtml = (b, sid, aid) => {
      const closed = b.autoClosed ? '<div><span class="tag auto">Closed at due date</span></div>' : '';
      const flag = flaggedLabs.some(x => x.l.student_id === sid && x.l.activity_id === aid) ? '<div><button type="button" class="tag flag" data-flags style="border:0;cursor:pointer">Review</button></div>' : '';
      if (view === 'complete') return (b.complete === null ? '—' : `${b.complete}%`) + closed + (b.open ? '<div><span class="tag">In progress</span></div>' : '') + flag;
      const score = b.best === null ? (b.open ? '' : '—') : `${b.best}% <span class="small muted">(${b.n})</span>`;
      const open = b.open ? `<div><span class="tag">In progress · ${Object.keys(b.open.steps || {}).length} steps</span></div>` : '';
      return score + closed + open + flag;
    };
    // Overall completion: the average over the columns shown, counting anything not started as 0%.
    const overall = sid => cols.length ? Math.round(10 * cols.reduce((s, a) => s + (cell(sid, a).complete || 0), 0) / cols.length) / 10 : null;
    const steps = list => list.length > 6 ? `steps ${list.slice(0, 6).join(', ')} and ${list.length - 6} more` : (list.length === 1 ? 'step ' : 'steps ') + list.join(', ');
    const nameOf = id => (people.find(p => p.id === id) || {}).name || 'Unknown student';
    const titleOf = id => (catalog.find(a => a.id === id) || {}).title || 'Lab';
    const when = t => t ? new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    const flagsHtml = !flaggedLabs.length ? '' : `<h3 id="flags">Attempts to review (${flaggedLabs.length})</h3>
      <p class="lead">The lab records how answers were entered, alongside the answers. These attempts show signs of AI tools, automation or copying. Treat them as a reason to look closer and talk with the student, not as proof: they never change a score.</p>
      <div class="scroll"><table class="flags"><thead><tr><th>Student</th><th>Lab</th><th>Attempt</th><th>What the lab saw</th></tr></thead><tbody>
      ${flaggedLabs.map(({ l, r }) => `<tr><td>${esc(nameOf(l.student_id))}</td><td>${esc(titleOf(l.activity_id))}</td>
        <td class="small">Started ${esc(when(l.started_at))}<br>${l.finished_at ? 'Finished ' + esc(when(l.finished_at)) : 'In progress'}</td>
        <td><ul>${Object.keys(FLAG_TEXT).filter(f => r.by[f]).map(f => `<li${STRONG.includes(f) ? ' style="font-weight:600"' : ''}>${esc(FLAG_TEXT[f])}: ${steps(r.by[f])}</li>`).join('')}</ul></td></tr>`).join('')}
      </tbody></table></div>`;
    const lead = view === 'score'
      ? '<p class="lead">Best finished score on each activity, as a percent. The small number is how many attempts finished. <b>In progress</b> means a lab attempt is still open. <b>Closed at due date</b> means an attempt was still open at the due date and was scored on the steps submitted. <b>Review</b> means the lab saw signs of AI tools, automation or copying (details below the table).</p>'
      : `<p class="lead">How much of each activity each student has done, as a percent, whether or not the answers were right. For a lab, it's the share of the lab's points in the steps submitted, on the student's furthest graded attempt. A game counts as 100% once a round is saved. <b>Overall</b> averages the activities shown, counting anything not started as 0%.${cols.length < acts.length ? ' Labs assigned as Practice don\'t record work, so they aren\'t shown.' : ''}</p>`;
    const csvNote = view === 'score' ? 'Graded activities only, out of 100 points. Blank means no finished attempt.' : 'The activities shown, as percent complete out of 100 points. Not started counts as 0.';
    pane.innerHTML = `<div class="seg" role="group" aria-label="Show in the gradebook"><button type="button" data-gview="score" aria-pressed="${view === 'score'}">Scores</button><button type="button" data-gview="complete" aria-pressed="${view === 'complete'}">Completion</button></div>
      ${flaggedLabs.length ? `<div class="msg bad" style="margin:0 0 12px"><b>${flaggedLabs.length} lab attempt${flaggedLabs.length === 1 ? '' : 's'} to review.</b> <button type="button" class="linkbtn" data-flags>See what the lab saw</button></div>` : ''}${lead}
      ${cols.length ? `<div class="scroll"><table><thead><tr><th>Student</th>${cols.map(a => `<th class="n">${esc(a.title)}</th>`).join('')}${view === 'complete' ? '<th class="n">Overall</th>' : ''}</tr></thead><tbody>
      ${people.map(p => `<tr><td>${esc(p.name)}<div class="small muted">${esc(p.email)}</div></td>${cols.map(a => `<td class="n">${cellHtml(cell(p.id, a), p.id, a.id)}</td>`).join('')}${view === 'complete' ? `<td class="n"><b>${overall(p.id)}%</b></td>` : ''}</tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:14px"><button class="btn gold" type="button" id="csv">Download ${view === 'score' ? 'scores' : 'completion'} CSV for Canvas</button><span class="small muted">${csvNote}</span></div><div id="csvmsg"></div>`
      : '<p class="empty">Nothing here records completion yet: assign a lab as Graded, or assign a game.</p>'}${flagsHtml}`;
    pane.querySelectorAll('[data-gview]').forEach(b => b.addEventListener('click', () => { state.gview = b.dataset.gview; gradesPane(c).catch(e => { pane.innerHTML = msg('bad', esc(e.message)); }); }));
    pane.querySelectorAll('[data-flags]').forEach(b => b.addEventListener('click', () => document.getElementById('flags').scrollIntoView({ behavior: 'smooth' })));
    const csv = document.getElementById('csv'); if (!csv) return;
    csv.addEventListener('click', () => {
      const out = view === 'score' ? acts.filter(graded) : cols;
      if (!out.length) { document.getElementById('csvmsg').innerHTML = msg('bad', 'No activity in this class is set to Graded.'); return; }
      // Completion columns get their own names, so importing them doesn't overwrite score columns in Canvas.
      const head = out.map(a => csvText(view === 'score' ? a.title : a.title + ' completion'));
      const value = (p, a) => { const b = cell(p.id, a); return view === 'score' ? (b.best === null ? '' : b.best) : (b.complete || 0); };
      downloadCsv([
        ['Student', 'ID', 'SIS User ID', 'SIS Login ID', 'Section', ...head],
        ['Points Possible', '', '', '', '', ...out.map(() => 100)],
        ...people.map(p => [csvText(p.name), '', '', csvText(p.email), csvText(c.name), ...out.map(a => value(p, a))])
      ], csvName(c, view === 'score' ? 'grades' : 'completion'));
    });
  }

  // ---------- delete a class ----------
  // Deleting a class also deletes its assignments, students, roster, scores and lab attempts (the database
  // cascades from courses). The dialog shows what will go and offers every grade as a CSV first.
  async function deleteDialog(c) {
    const dlg = document.getElementById('deldlg');
    dlg.innerHTML = `<div class="dh"><h2 id="delh">Delete ${esc(c.name)}?</h2></div><div class="db" id="delbody"><p class="muted">Checking what's in this class…</p></div>`;
    dlg.showModal();
    const body = document.getElementById('delbody');
    let g;
    try { g = await gradeData(c); } catch (e) { body.innerHTML = msg('bad', esc(e.message)) + '<div class="acts"><button class="btn" type="button" data-close>Close</button></div>'; body.querySelector('[data-close]').addEventListener('click', () => dlg.close()); return; }
    const n = g.people.length, s = g.att.length, l = g.labs.length;
    const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
    const has = n && g.acts.length;
    body.innerHTML = `<p>This permanently deletes <b>${esc(c.name)}</b>${c.term ? ' (' + esc(c.term) + ')' : ''} and everything in it: its assignments, its student list and roster, and every saved score and lab attempt (${plural(n, 'student')}, ${plural(s, 'saved score')}, ${plural(l, 'lab attempt')}). Students will no longer see the class, and its join code stops working.</p>
      <p><b>This can't be undone.</b> ${has ? 'Download the grades first if you may need them.' : 'This class has no grades to download.'}</p>
      ${has ? '<div class="row"><button class="btn gold" type="button" id="delcsv">Download all grades (CSV)</button></div>' : ''}<div id="delmsg"></div>
      <div class="acts"><button class="btn" type="button" id="delno">Cancel</button><button class="btn danger solid" type="button" id="delyes">Delete class</button></div>`;
    document.getElementById(has ? 'delcsv' : 'delno').focus();   // never start on the delete button
    const say = h => { document.getElementById('delmsg').innerHTML = h; };
    if (has) document.getElementById('delcsv').addEventListener('click', () => {
      // Every scored activity in the class, graded or practice: best score and percent complete.
      const file = csvName(c, 'all grades');
      downloadCsv([
        ['Student', 'Email', ...g.acts.flatMap(a => [csvText(a.title + ' best score %'), csvText(a.title + ' completion %')])],
        ...g.people.map(p => [csvText(p.name), csvText(p.email), ...g.acts.flatMap(a => { const b = g.cell(p.id, a); return [b.best === null ? '' : b.best, b.complete === null ? '' : b.complete]; })])
      ], file);
      say(msg('good', `Downloaded ${esc(file)}. Check that it opened before you delete the class.`));
    });
    document.getElementById('delno').addEventListener('click', () => dlg.close());
    document.getElementById('delyes').addEventListener('click', async () => {
      body.querySelectorAll('button').forEach(b => { b.disabled = true; });
      say(msg('info', 'Deleting…'));
      const { data, error } = await sb.from('courses').delete().eq('id', c.id).select('id');
      if (error || !data || !data.length) {
        say(msg('bad', esc(error ? error.message : 'The class could not be deleted. Reload the page and try again.')));
        body.querySelectorAll('button').forEach(b => { b.disabled = false; });
        return;
      }
      dlg.close();
      state.course = null; state.tab = 'assign';
      instructorView(msg('good', `Deleted ${esc(c.name)}.`));
    });
  }

  // ---------- admin ----------
  async function adminView(note = '') {
    const { data: reqs, error } = await sb.from('instructor_requests').select('id,full_name,email,directory_url,created_at').eq('status', 'pending').order('created_at');
    if (error) { app.innerHTML = `<div class="card">${msg('bad', esc(error.message))}</div>`; return; }
    app.innerHTML = `<div class="card"><h2>Pending instructor requests</h2>
      <p class="lead">Open the directory link and check that the person is listed there before you approve.</p>
      ${reqs.length ? `<div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Directory page</th><th>Requested</th><th>Note (optional)</th><th></th></tr></thead><tbody>
      ${reqs.map(r => `<tr data-r="${esc(r.id)}"><td>${esc(r.full_name || '')}</td><td>${esc(r.email)}</td>
        <td>${/^https:\/\//i.test(r.directory_url) ? `<a href="${esc(r.directory_url)}" target="_blank" rel="noopener noreferrer">${esc(r.directory_url)}</a>` : esc(r.directory_url)}</td>
        <td class="small">${esc(fmtDate(r.created_at))}</td>
        <td><input name="note" maxlength="1000" aria-label="Note for ${esc(r.full_name || r.email)}"></td>
        <td style="white-space:nowrap"><button class="btn sm primary" type="button" data-review="1">Approve</button> <button class="btn sm" type="button" data-review="0">Reject</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="empty">No pending requests.</p>'}${note}</div>`;
    app.querySelectorAll('[data-review]').forEach(b => b.addEventListener('click', async () => {
      const tr = b.closest('tr'), approve = b.dataset.review === '1';
      tr.querySelectorAll('button').forEach(x => { x.disabled = true; });
      const { error } = await sb.rpc('review_instructor_request', { p_request: tr.dataset.r, p_approve: approve, p_note: tr.querySelector('[name="note"]').value.trim() || null });
      adminView(error ? msg('bad', esc(error.message)) : msg('good', approve ? 'Request approved. That account is now an instructor.' : 'Request rejected.'));
    }));
  }

  // ---------- startup ----------
  function homeView() {
    const admin = !!(me.is_admin && location.hash === '#admin');
    const link = document.getElementById('adminlink');
    link.hidden = !me.is_admin;
    link.textContent = admin ? 'Back to my classes' : 'Instructor requests';
    link.href = admin ? '#' : '#admin';
    if (admin) return adminView();
    return me.role === 'instructor' ? instructorView() : studentView();
  }
  async function start() {
    me = await loadMe();
    if (!me) return authView();
    await loadCatalog();
    document.getElementById('toolbar').hidden = false;
    document.getElementById('who').textContent = me.full_name || me.email;
    document.getElementById('role').textContent = (me.role === 'instructor' ? 'Instructor' : 'Student') + (me.is_admin ? ' · Admin' : '');
    return homeView();
  }
  const fail = e => { app.innerHTML = `<div class="card">${msg('bad', 'Could not reach the course server. ' + esc(e.message))}</div>`; };
  window.addEventListener('hashchange', () => { if (me) Promise.resolve(homeView()).catch(fail); });
  document.getElementById('signout').addEventListener('click', async () => { await sb.auth.signOut(); me = null; history.replaceState(null, '', location.pathname); start().catch(fail); });
  start().catch(fail);
})();
</script>
</body>
</html>
